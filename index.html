 ai prodotti/servizi finali realizzati dal progetto"},{"letter":"B","text":"Sono i riferimenti qualitativi e quantitativi per verificare l’andamento del progetto e il suo completamento"},{"letter":"C","text":"Sono individuati dalla lista degli Obiettivi di progetto"},{"letter":"D","text":"Stabiliscono le linee di azione da seguire per raggiungere gli obiettivi"}],"answer":"B","id":134},{"source":"Simulazione 1-30","orig_num":23,"question":"Che differenza vi è fra matrice RAM e Matrice RACI?","options":[{"letter":"A","text":"Nessuna differenza; sono la medesima cosa."},{"letter":"B","text":"La matrice RAM individua solo chi è responsabile mentre con la RACI si individua chi è Responsabile, chi Approva, chi Controlla, chi deve essere solo Informato."},{"letter":"C","text":"La RAM individua chi è responsabile mente la RACI anche chi partecipa"},{"letter":"D","text":"La matrice RACI non esiste"}],"answer":"B","id":135},{"source":"Simulazione 1-30","orig_num":24,"question":"Quali delle seguenti definizioni di program manager è vera in generale:","options":[{"letter":"A","text":"un program manager coordina più project manager"},{"letter":"B","text":"un program manager coordina più portfolio manager e project manager"},{"letter":"C","text":"un program manager risponde sempre a uno steering committee"},{"letter":"D","text":"un program manager risponde a più sponsor"}],"answer":"A","id":136},{"source":"Simulazione 1-30","orig_num":25,"question":"Lo strumento del project financing a cosa si applica?","options":[{"letter":"A","text":"Alla gestione finanziaria dei progetti"},{"letter":"B","text":"Alla gestione dei subfornitori"},{"letter":"C","text":"All’individuazione del ROI"},{"letter":"D","text":"All’erogazione di mutui facilitati agli stakeholders."}],"answer":"A","id":137},{"source":"Simulazione 1-30","orig_num":26,"question":"Un membro del team di progetto pur esaminando tutti i report di pianificazione fornitigli dal Project Manager non ha compreso bene quali siano i risultati attesi. Quale documento è probabilmente inconsistente?","options":[{"letter":"A","text":"PPS"},{"letter":"B","text":"Il Mandato di Progetto (Project Mandate)"},{"letter":"C","text":"ABS"},{"letter":"D","text":"WBS"}],"answer":"D","id":138},{"source":"Simulazione 1-30","orig_num":27,"question":"Nel campo degli standard e norme utilizzabili nel project management e nella qualità il termine ISO-EN identifica:","options":[{"letter":"A","text":"Una norma europea"},{"letter":"B","text":"Una norma equivalente a ISO-UNI"},{"letter":"C","text":"Una linea guida internazionale"},{"letter":"D","text":"Simbolo europeo di certificazione di qualità"}],"answer":"A","id":139},{"source":"Simulazione 1-30","orig_num":28,"question":"I processi di pianificazione integrata del project management mirano essenzialmente a definire:","options":[{"letter":"A","text":"I costi, i fabbisogni di risorse e la qualità dei deliverable"},{"letter":"B","text":"Responsabilità e ruoli del project team, milestone e qualità dei deliverable"},{"letter":"C","text":"Tempi, costi e qualità"},{"letter":"D","text":"Le responsabilità e i ruoli nel soddisfare i requisiti, le risorse necessarie e il percorso critico delle attività"}],"answer":"D","id":140},{"source":"Simulazione 1-30","orig_num":29,"question":"Nel corso di un progetto software, il cliente richiese di modificare una maschera di input dati. Quale impatto ebbe senz’altro la richiesta (accettata dal project manager)?","options":[{"letter":"A","text":"Una revisione di almeno un configuration item (elemento di configurazione)"},{"letter":"B","text":"Una approvazione da parte dello sponsor"},{"letter":"C","text":"Un ritardo nella data di consegna del software."},{"letter":"D","text":"Una riunione di SAL con lo sponsor."}],"answer":"A","id":141},{"source":"Simulazione 1-30","orig_num":30,"question":"La definizione più appropriata di allocazione dei costi è:","options":[{"letter":"A","text":"Calcolare i costi del progetto rispetto agli intervalli temporali della schedulazione per definire il budget."},{"letter":"B","text":"Metodo di stima top-down dei costi"},{"letter":"C","text":"Stima di tutti i costi necessari per il completamento del progetto."},{"letter":"D","text":"Sinonimo di budget di progetto"}],"answer":"A","id":142},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":1,"question":"Con il termine Portafoglio (o Portfolio) si intende:","options":[{"letter":"A","text":"Un insieme di progetti, programmi e altri interventi o attività non necessariamente correlati"},{"letter":"B","text":"Un insieme di progetti, programmi e altri interventi o attività fra loro correlati"},{"letter":"C","text":"Un insieme di progetti, programmi e altri interventi o attività aventi un obiettivo finanziario"},{"letter":"D","text":"Un insieme di progetti, programmi e altri interventi o attività fra loro correlati e aventi un obiettivo finanziario"}],"answer":"A","id":143},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":2,"question":"L'amministrazione dei contratti di progetto:","options":[{"letter":"A","text":"Deve seguire l'intero ciclo di vita di un progetto, per quanto concerne i relativi contratti."},{"letter":"B","text":"Deve provvedere alla chiusura dei contratti di beni e servizi necessari al progetto, prima della esecuzione."},{"letter":"C","text":"Riguarda sia la chiusura dei contratti sia la chiusura del progetto."},{"letter":"D","text":"Deve provvedere alla corretta fatturazione dei fornitori, in base alle prestazioni regolarmente erogate e verificate dal project manager."}],"answer":"A","id":144},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":3,"question":"Nel project management la sigla CPM significa:","options":[{"letter":"A","text":"Critical Path Method"},{"letter":"B","text":"Critical Project Measure"},{"letter":"C","text":"Cost Performance Method"},{"letter":"D","text":"Critical Performance Measure"}],"answer":"A","id":145},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":4,"question":"Qual è la miglior definizione di contratto?","options":[{"letter":"A","text":"Accordo vincolante tra le parti"},{"letter":"B","text":"Obbligo per il fornitore"},{"letter":"C","text":"Obbligo per l'acquirente"},{"letter":"D","text":"Nessuna delle risposte elencate è valida"}],"answer":"A","id":146},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":5,"question":"Il diagramma di Gantt viene utilizzato per:","options":[{"letter":"A","text":"Descrivere la struttura organizzativa delle risorse di un progetto"},{"letter":"B","text":"Rappresentare la curva dei costi di un progetto"},{"letter":"C","text":"Rappresentare la schedulazione di un progetto"},{"letter":"D","text":"Rappresentare il piano di comunicazione"}],"answer":"C","id":147},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":6,"question":"Nel project management per “attività” si intende:","options":[{"letter":"A","text":"Le parti di lavoro elementari in cui si scompone tutto il lavoro del progetto, in particolare ai fini di stima delle durate, schedulazione e controllo."},{"letter":"B","text":"Gli elementi della struttura gerarchica del lavoro di progetto al più basso livello."},{"letter":"C","text":"Gli elementi componenti di un processo o di una pianificazione."},{"letter":"D","text":"Gli elementi di un diagramma di Gantt."}],"answer":"A","id":148},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":7,"question":"Quali tra le seguenti non sono in generale risorse affidate a un progetto?","options":[{"letter":"A","text":"I membri del Project Management Team"},{"letter":"B","text":"Il Project Management Office"},{"letter":"C","text":"Beni e servizi utilizzabili per raggiungere il risultato"},{"letter":"D","text":"Il Project Manager"}],"answer":"B","id":149},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":8,"question":"Un Project Manager effettua il livellamento delle risorse quando:","options":[{"letter":"A","text":"Vuole distribuire uniformemente i compensi tra i membri del team di progetto"},{"letter":"B","text":"Intende equiparare il livello di conoscenza delle risorse umane"},{"letter":"C","text":"Desidera ridurre i costi sull'uso delle risorse"},{"letter":"D","text":"Intende ottimizzare la pianificazione temporale delle attività tra le risorse"}],"answer":"D","id":150},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":9,"question":"Le attività di documentazione e reportistica consentono:","options":[{"letter":"A","text":"La comunicazione fra tutti gli stakeholder coinvolti, in ogni fase del progetto"},{"letter":"B","text":"La comunicazione fra il project manager, lo sponsor e il cliente"},{"letter":"C","text":"La definizione delle interfacce organizzative (a chi), la loro periodicità (quando), gli strumenti di comunicazione e il come"},{"letter":"D","text":"Il controllo del piano della comunicazione (Communication Plan)"}],"answer":"A","id":151},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":18,"question":"Quando non sia possibile per il project manager risolvere i problemi degli stakeholder, può essere necessario eseguire:","options":[{"letter":"A","text":"Un rapporto di fine progetto"},{"letter":"B","text":"La chiusura amministrativa"},{"letter":"C","text":"La chiusura della singola fase progettuale oggetto del contendere"},{"letter":"D","text":"Una escalation verso un livello superiore (Sponsor)"}],"answer":"D","id":152},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":27,"question":"Qual è la Struttura Gerarchica di un progetto orientata ai Deliverable?","options":[{"letter":"A","text":"La Matrice di Responsabilità"},{"letter":"B","text":"La OBS"},{"letter":"C","text":"La WBS (Work Breakdown Structure)"},{"letter":"D","text":"La DWS"}],"answer":"C","id":153},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":28,"question":"Lo sponsor si lamentò con il project manager perché lo “statement of work” era incompleto e poco chiaro per il fornitore. Si riferiva al fatto che:","options":[{"letter":"A","text":"I documenti del contratto non erano sufficientemente dettagliati per l'assegnazione del lavoro"},{"letter":"B","text":"Il piano generale di progetto richiedeva una revisione generale"},{"letter":"C","text":"Il piano degli approvvigionamenti delle risorse doveva essere approfondito e migliorato"},{"letter":"D","text":"La dichiarazione del lavoro svolto alla fine del contratto non era sufficiente per i pagamenti"}],"answer":"A","id":154},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":29,"question":"Cosa è il dizionario della WBS?","options":[{"letter":"A","text":"Il piano della WBS"},{"letter":"B","text":"Documento contenente le descrizioni esaurienti di ciascun elemento della WBS"},{"letter":"C","text":"La baseline dell'ambito"},{"letter":"D","text":"Le istruzioni di lavoro con cui costruire la WBS di progetto"}],"answer":"B","id":155},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":30,"question":"Per “total float” si intende:","options":[{"letter":"A","text":"La durata totale del progetto"},{"letter":"B","text":"Il possibile scorrimento massimo di una attività senza influenzare la durata del progetto"},{"letter":"C","text":"Quanto una attività può ritardare senza posticipare l'inizio della attività seguente"},{"letter":"D","text":"La differenza fra la data di inizio e la data di fine al più presto di una attività"}],"answer":"B","id":156},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":33,"question":"Il Project Management Team è:","options":[{"letter":"A","text":"Un sottoinsieme delle risorse di progetto deputato a supportare il project manager nelle attività gestionali"},{"letter":"B","text":"Non è costituito da risorse del progetto ma da coloro che operano nel PMO"},{"letter":"C","text":"È costituito da coloro che supportano il Project Manager nelle sue attività gestionali ma che determinano costi sul progetto"},{"letter":"D","text":"Sono le risorse che realizzano le attività del Gantt"}],"answer":"A","id":157},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":34,"question":"Un'analisi “make or buy”:","options":[{"letter":"A","text":"Deve applicarsi a beni e servizi di alto rischio e complessità"},{"letter":"B","text":"Deve completarsi con la firma di un contratto"},{"letter":"C","text":"Può completarsi con la firma di un contratto"},{"letter":"D","text":"Deve applicarsi a beni e servizi di uso comune"}],"answer":"C","id":158},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":35,"question":"In un progetto realizzato nell'ambito di una ATI (associazione temporanea di imprese), uno degli aspetti più critici è:","options":[{"letter":"A","text":"Il processo di pianificazione e la definizione degli accordi stipulati, al fine di evitare insorgenza di claim interni fra i partner"},{"letter":"B","text":"La rilevazione e la ripartizione dei costi di progetto"},{"letter":"C","text":"I ruoli e le responsabilità fra i diversi componenti di progetto"},{"letter":"D","text":"La legge del paese applicabile per superare le vertenze e i conflitti tra i partner"}],"answer":"A","id":159},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":39,"question":"Nel project management la cosiddetta “Curva ad S” ha di norma ascissa e ordinata rispettivamente indicanti le seguenti unità di misura:","options":[{"letter":"A","text":"Costi (inclusi ricavi), tempo"},{"letter":"B","text":"Euro, giorni"},{"letter":"C","text":"Tempo, costi cumulati"},{"letter":"D","text":"Euro, euro"}],"answer":"C","id":160},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":40,"question":"Affinché tutti i configuration item possano essere adeguatamente gestiti è necessario che siano definite le possibili tipologie e le operazioni che su di essi possono essere compiute. In quale gruppo di processi tutto ciò viene definito?","options":[{"letter":"A","text":"Esecuzione"},{"letter":"B","text":"Avvio"},{"letter":"C","text":"Pianificazione"},{"letter":"D","text":"Controllo"}],"answer":"C","id":161},{"source":"Nuovo paniere imm etter":"B","text":"Può non riuscire ad eliminare tutti i sovraccarichi"},{"letter":"C","text":"Determina molto probabilmente un ritardo nella data di fine progetto"},{"letter":"D","text":"Si può applicare anche su attività non aventi total float"}],"answer":"A","id":166},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":47,"question":"In relazione alla stima dei costi, allorché un progetto comprende un numero di attività ripetitive e sequenziali, ad elevato contenuto di lavoro umano, si può adottare quale metodo di miglior stima?","options":[{"letter":"A","text":"Una percentuale di riduzione fissa calcolata in base alla curva di apprendimento, stimando il costo della prima unità e il fattore di decremento esponenziale del costo secondo la stessa curva"},{"letter":"B","text":"Una percentuale di riduzione fissa calcolabile come media della stima del costo della prima, di quella intermedia e dell'ultima unità realizzata"},{"letter":"C","text":"Una percentuale di riduzione fissa calcolabile come media della stima del costo della prima e dell'ultima unità realizzata"},{"letter":"D","text":"Una percentuale di riduzione fissa calcolabile come media delle stime di costo della prima unità fornite da un gruppo di esperti"}],"answer":"A","id":167},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":48,"question":"Cosa si intende per contratto lump-sum?","options":[{"letter":"A","text":"Contratto a prezzo fisso (fixed price) in cui il fornitore sarà tenuto a consegnare quanto previsto con le modalità e nei termini stabiliti a un prezzo fissato"},{"letter":"B","text":"Contratto a tempo e materiali (time and material) in cui la previsione del costo della fornitura si basa su una stima dello stesso, con possibilità di adeguare l'importo finale all'effettivo utilizzo delle risorse"},{"letter":"C","text":"Non esiste"},{"letter":"D","text":"Contratto costi e spese, in cui vengono rimborsate le spese effettivamente sostenute con l'aggiunta di un compenso prestabilito per l'opera svolta dal fornitore"}],"answer":"A","id":168},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":49,"question":"In un progetto della durata di 10 mesi e con costo stimato di 30K€, dopo 4 mesi il project manager ha la seguente situazione: % avanzamento = 30%, AC = 15K€, PV = 12K€. Qual è il costo stimato delle attività per completare il progetto, senza usare CPI?","options":[{"letter":"A","text":"18K€"},{"letter":"B","text":"9K€"},{"letter":"C","text":"21K€"},{"letter":"D","text":"15K€"}],"answer":"C","id":169},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":50,"question":"L'applicazione dei processi di project management secondo le buone prassi dovrebbe essere personalizzata:","options":[{"letter":"A","text":"In tutte le fasi di un progetto"},{"letter":"B","text":"Dai team manager su ogni singolo pacchetto di lavoro"},{"letter":"C","text":"Dal project manager sul singolo progetto o su ogni singola fase"},{"letter":"D","text":"Dallo sponsor in collaborazione con gli altri stakeholder sul singolo progetto o su ogni singola fase"}],"answer":"C","id":170},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":51,"question":"Nelle comunicazioni di progetto, un sistema efficiente ed efficace di reporting deve essere impostato secondo:","options":[{"letter":"A","text":"I criteri della metodologia adottata di project management"},{"letter":"B","text":"Le esigenze informative richieste ed esplicitate dallo sponsor"},{"letter":"C","text":"I contenuti e il dettaglio richiesto da tutti i soggetti interessati dal progetto"},{"letter":"D","text":"Le norme interne aziendali e quelle di legge"}],"answer":"C","id":171},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":52,"question":"Scegliere tra le seguenti quelle doti che rimandano al concetto di leadership:","options":[{"letter":"A","text":"La capacità di influenzare e di costringere le persone allo scopo di indurre il consenso a conseguire determinati obiettivi"},{"letter":"B","text":"Essere in grado di guidare un gruppo di persone grazie all'autorità e autorevolezza"},{"letter":"C","text":"Avere specifiche abilità di carattere personale, relazionale, pensiero strategico, creativo e sistemico"},{"letter":"D","text":"Essere in grado di sostituirsi ai membri del team di progetto per apparire un pari tra i pari; il governo del progetto deve essere sempre fatto in maniera delegante"}],"answer":"C","id":172},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":53,"question":"Che cosa si intende per orientamento al risultato?","options":[{"letter":"A","text":"Tener conto del profitto generato dal progetto"},{"letter":"B","text":"Operare nei modi più idonei con le energie proprie e quelle altrui per raggiungere un obiettivo prefissato"},{"letter":"C","text":"Rispettare i tempi secondo le milestone di progetto"},{"letter":"D","text":"Assicurarsi che il proprio progetto sia competitivo di fronte a quelli della concorrenza"}],"answer":"B","id":173},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":56,"question":"Nella gestione dei conflitti, il confronto significa:","options":[{"letter":"A","text":"Affrontare apertamente il conflitto, con logica win-win"},{"letter":"B","text":"Trovare un compromesso alle situazioni di crisi"},{"letter":"C","text":"Far prevalere il proprio punto di vista"},{"letter":"D","text":"Richiedere al project manager di fungere da arbitro, attenuando il conflitto"}],"answer":"A","id":174},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":58,"question":"Rinunciare alla soluzione di un problema da parte di un project manager può essere:","options":[{"letter":"A","text":"Un'applicazione del processo di problem solving"},{"letter":"B","text":"Una strategia in una situazione di conflitto"},{"letter":"C","text":"Un metodo di negoziazione (win-win)"},{"letter":"D","text":"Un'applicazione del pensiero laterale"}],"answer":"B","id":175},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":24,"question":"L'elemento di configurazione K19.01.03 è stato modificato a seguito del test di precollaudo. È necessario: (individua la proposizione errata)","options":[{"letter":"A","text":"Aggiornare la descrizione, gli attributi e la versione dell'elemento nel sistema di gestione della configurazione"},{"letter":"B","text":"Controllare le modifiche sull'elemento"},{"letter":"C","text":"Verificare e convalidare le modifiche"},{"letter":"D","text":"Organizzare un meeting con il responsabile dell'assicurazione qualità"}],"answer":"D","id":176},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":25,"question":"La disponibilità limitata delle risorse può influenzare: (individua la proposizione errata)","options":[{"letter":"A","text":"Tempi e costi del progetto"},{"letter":"B","text":"Qualità e costi del progetto"},{"letter":"C","text":"Il fabbisogno di progetto"},{"letter":"D","text":"Tempi, costi e qualità del progetto"}],"answer":"C","id":177},{"source":"Nuovo paniere immagini 28/09/2026","orig_num":26,"question":"Nel Project Management si definiscono come “modelli di maturità”:","options":[{"letter":"A","text":"Livelli di crescita organizzativa raggiunti da un'azienda nell'applicazione di metodologie e best practice nel project management"},{"letter":"B","text":"Modelli di norme e standard di riferimento ai migliori livelli del mercato"},{"letter":"C","text":"Capacità delle aziende di gestire determinati progetti"},{"letter":"D","text":"Livelli di valutazione delle risorse umane di project management"}],"answer":"A","id":178}];
let test=[],idx=0,answers={},locked={},mistakes=[],timerHandle=null,timeLeft=90*60,deadlineMs=null,finished=false;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function syncMode(){const exam=$('mode').value==='exam';$('submitExamBtn').classList.toggle('hidden',!exam);$('timerBox').classList.toggle('hidden',!exam)}
function startTimer(){clearInterval(timerHandle);finished=false;deadlineMs=Date.now()+90*60*1000;tickTimer();timerHandle=setInterval(tickTimer,1000)}
function tickTimer(){if(deadlineMs===null)return;timeLeft=Math.max(0,Math.ceil((deadlineMs-Date.now())/1000));updateTimer();if(timeLeft<=0&&!finished){clearInterval(timerHandle);finish(true)}}
function updateTimer(){let m=Math.floor(timeLeft/60),sec=timeLeft%60;$('timer').textContent=String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');$('timerBox').classList.toggle('warning',timeLeft<=15*60&&timeLeft>5*60);$('timerBox').classList.toggle('danger',timeLeft<=5*60);updateAnswered()}
function updateAnswered(){let n=test.filter(q=>answers[q.id]).length;$('answeredCount').textContent=`${n}/${test.length||60} risposte`;renderGrid()}
function start(custom=null){clearInterval(timerHandle);deadlineMs=null;answers={};locked={};mistakes=[];idx=0;finished=false;$('summary').classList.add('hidden');syncMode();let pool=custom?custom.slice():BANK.slice();shuffle(pool);let exam=$('mode').value==='exam';let n=Math.min(parseInt($('count').value),pool.length);test=pool.slice(0,n);if(exam)startTimer();else{timeLeft=90*60;updateTimer()}render()}
function renderGrid(){const g=$('qgrid');if(!g)return;g.innerHTML='';test.forEach((q,i)=>{let c='qnum';if(i===idx)c+=' active';else if(locked[q.id]===true)c+=' good';else if(locked[q.id]===false)c+=' bad';else if(answers[q.id])c+=' done';const b=document.createElement('button');b.className=c;b.textContent=i+1;b.onclick=()=>{idx=i;render()};g.appendChild(b)})}
function render(){if(!test.length)return;const q=test[idx],mode=$('mode').value,chosen=answers[q.id];let body=`<div class="meta"><span>Domanda ${idx+1} di ${test.length}</span><span>${mode==='live'?'Corrette: '+Object.values(locked).filter(x=>x===true).length:'Risposte: '+test.filter(x=>answers[x.id]).length+'/'+test.length}</span></div><div class="q">${esc(q.question)}</div>`;
q.options.forEach(o=>{let cls='opt';if(locked[q.id]&&o.letter===q.answer)cls+=' correct';if(locked[q.id]===false&&chosen===o.letter)cls+=' wrong';body+=`<label class="${cls}"><input type="radio" name="ans" value="${o.letter}" ${chosen===o.letter?'checked':''} ${Object.prototype.hasOwnProperty.call(locked,q.id)?'disabled':''}><span class="letter">${o.letter}</span><span>${esc(o.text)}</span></label>`});
if(Object.prototype.hasOwnProperty.call(locked,q.id)){if(chosen===q.answer)body+=`<div class="feedback ok">Risposta corretta.</div>`;else body+=`<div class="feedback bad">Risposta corretta: <b>${q.answer}</b> — ${esc(q.options.find(x=>x.letter===q.answer).text)}</div>`}
body+=`<div class="actions"><button class="btn light" id="prev" ${idx===0?'disabled':''}>← Precedente</button>${mode==='live'&&!Object.prototype.hasOwnProperty.call(locked,q.id)?'<button class="btn primary" id="check">Correggi</button>':''}<button class="btn light" id="next" ${idx===test.length-1?'disabled':''}>Successiva →</button>${mode==='live'&&idx===test.length-1?'<button class="btn primary" id="finish">Termina test</button>':''}</div>`;
$('quiz').innerHTML=body;$('bar').style.width=((idx+1)/test.length*100)+'%';document.querySelectorAll('input[name=ans]').forEach(el=>el.onchange=e=>{answers[q.id]=e.target.value;updateAnswered();if(mode==='live')render()});if($('check'))$('check').onclick=checkCurrent;$('prev').onclick=()=>{idx--;render()};$('next').onclick=()=>{idx++;render()};if($('finish'))$('finish').onclick=()=>finish(false);updateAnswered()}
function checkCurrent(){const q=test[idx];if(!answers[q.id])return alert('Seleziona una risposta.');locked[q.id]=answers[q.id]===q.answer;if(!locked[q.id])mistakes.push(q);render()}
function finish(auto=false){if(finished)return;const mode=$('mode').value;if(mode==='exam'&&!auto){let answered=test.filter(q=>answers[q.id]).length;if(!confirm(`Vuoi consegnare il test? Hai risposto a ${answered} domande su ${test.length}.`))return}finished=true;clearInterval(timerHandle);if(mode==='exam'){test.forEach(q=>{locked[q.id]=answers[q.id]===q.answer;if(answers[q.id]!==q.answer)mistakes.push(q)})}else{test.forEach(q=>{if(answers[q.id]&&!Object.prototype.hasOwnProperty.call(locked,q.id)){locked[q.id]=answers[q.id]===q.answer;if(!locked[q.id])mistakes.push(q)}})}let answered=test.filter(q=>answers[q.id]).length,correct=test.filter(q=>answers[q.id]===q.answer).length,pct=Math.round(correct/test.length*100);if(deadlineMs!==null)timeLeft=Math.max(0,Math.ceil((deadlineMs-Date.now())/1000));let elapsed=90*60-timeLeft,em=Math.floor(elapsed/60),es=elapsed%60;let out=`<h2>Risultato: ${correct} / ${test.length}</h2><div class="resultRow"><span class="pill">Percentuale: ${pct}%</span><span class="pill">Risposte date: ${answered}</span><span class="pill">Errori / non risposte: ${test.length-correct}</span>${mode==='exam'?`<span class="pill">Tempo: ${em}:${String(es).padStart(2,'0')}</span>`:''}</div>${auto?'<p><b>Tempo scaduto:</b> il test è stato consegnato automaticamente.</p>':''}`;
let wrong=test.filter(q=>answers[q.id]!==q.answer);if(wrong.length){out+='<h3>Domande da rivedere</h3>';wrong.forEach(q=>{let u=answers[q.id]||'—',c=q.answer;out+=`<div class="mistake"><b>${esc(q.question)}</b><br>Tua risposta: ${u}<br>Risposta corretta: <b>${c}</b> — ${esc(q.options.find(x=>x.letter===c).text)}</div>`})}$('summary').innerHTML=out;$('summary').classList.remove('hidden');renderGrid();window.scrollTo({top:$('summary').offsetTop-20,behavior:'smooth'})}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&$('mode').value==='exam'&&!finished)tickTimer()});window.addEventListener('focus',()=>{if($('mode').value==='exam'&&!finished)tickTimer()});
$('mode').onchange=()=>start();$('count').onchange=()=>start();$('newBtn').onclick=()=>start();$('submitExamBtn').onclick=()=>finish(false);$('retryBtn').onclick=()=>{let wrong=test.filter(q=>answers[q.id]!==q.answer);if(!wrong.length)return alert('Non ci sono errori da ripetere in questo test.');$('mode').value='live';syncMode();start(wrong)};syncMode();start();
</script>
