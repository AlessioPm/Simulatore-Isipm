<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2b55">
<title>Simulatore ISIPM-Base</title>
<style>
:root{--navy:#0f2b55;--blue:#1f5fae;--blue2:#2f74c8;--bg:#f4f7fb;--card:#fff;--text:#182234;--muted:#6b778c;--line:#dfe6ef;--ok:#18844b;--bad:#c13b3b;--soft:#eef4fb;--shadow:0 16px 40px rgba(24,50,85,.10)}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#edf3fa 0,#f7f9fc 240px,#f7f9fc 100%);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,select{font:inherit}
.shell{max-width:1180px;margin:0 auto;padding:24px 18px 54px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--navy),#173d73 55%,#215b9c);color:#fff;border-radius:24px;padding:28px 30px;box-shadow:0 20px 50px rgba(15,43,85,.22);margin-bottom:20px}
.hero:after{content:"";position:absolute;right:-70px;top:-100px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.07)}
.brand{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.mark{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:#fff;color:var(--navy);font-weight:900;font-size:20px;letter-spacing:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.hero h1{margin:0;font-size:clamp(26px,3vw,38px);letter-spacing:-.5px}
.hero p{margin:8px 0 0;opacity:.9;font-size:15px}
.topbar{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:18px}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.field{display:flex;flex-direction:column;gap:6px;min-width:170px}
.field label{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
select{height:44px;border:1px solid #cfd8e6;background:#fff;border-radius:11px;padding:0 38px 0 12px;color:var(--text);font-weight:700;outline:none}
select:focus{border-color:#8cb5e5;box-shadow:0 0 0 3px #dcecff}
.btn{height:44px;border-radius:11px;border:1px solid transparent;padding:0 16px;font-weight:800;cursor:pointer;transition:.16s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-1px)} .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 7px 18px rgba(31,95,174,.22)}
.btn.light{background:#fff;border-color:#d8e0eb;color:#334155}
.btn.danger{background:#b83232;color:white}
.timer{min-width:225px;border:1px solid #cddff4;background:#f4f8fd;border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.timer .label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em} .timer strong{font-variant-numeric:tabular-nums;font-size:26px;letter-spacing:.5px;color:var(--navy)} .timer small{display:block;color:var(--muted);margin-top:2px}
.timer.warning{background:#fff8ec;border-color:#f4cc85} .timer.danger{background:#fff1f1;border-color:#efb3b3}
.progress{height:7px;background:#e8edf4;border-radius:999px;overflow:hidden;margin-bottom:18px} .bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),#57a2ea);transition:width .2s ease}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.quiz{padding:26px}
.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px;font-weight:700;margin-bottom:14px}
.q{font-size:clamp(20px,2.2vw,27px);font-weight:850;line-height:1.35;letter-spacing:-.2px;margin:8px 0 22px}
.opt{position:relative;display:flex;align-items:flex-start;gap:12px;border:1px solid #dbe3ee;background:#fff;border-radius:14px;padding:14px 15px;margin:10px 0;cursor:pointer;transition:.15s}
.opt:hover{border-color:#93b5dc;background:#f8fbff;transform:translateY(-1px)} .opt input{margin-top:3px;accent-color:var(--blue);transform:scale(1.15)}
.letter{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:8px;background:#edf3fa;color:#254b78;font-weight:900;font-size:13px}
.opt.correct{border-color:#8bd3aa;background:#f1fbf5} .opt.wrong{border-color:#efb2b2;background:#fff4f4}
.feedback{margin-top:16px;border-radius:13px;padding:13px 15px;font-weight:800} .feedback.ok{background:#e8f8ef;color:#14683d} .feedback.bad{background:#fdecec;color:#9d2f2f}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;padding-top:18px;border-top:1px solid #edf1f5}
.side{padding:18px;position:sticky;top:18px}
.side h3{font-size:14px;margin:0 0 12px;color:#32445d} .side p{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.qnum{height:38px;border-radius:10px;border:1px solid #d9e1eb;background:#fff;font-weight:800;color:#526174;cursor:pointer} .qnum:hover{border-color:#8fb1d7} .qnum.active{background:var(--navy);color:#fff;border-color:var(--navy)} .qnum.done{background:#e9f3ff;border-color:#b9d5f3;color:#1e5b9f} .qnum.bad{background:#fff0f0;border-color:#efb4b4;color:#a62e2e} .qnum.good{background:#eef9f2;border-color:#a9d9ba;color:#197044}
.summary{padding:24px;margin-top:18px} .summary h2{margin:0 0 8px;font-size:28px} .resultRow{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0} .pill{padding:9px 12px;border-radius:999px;background:#f1f5f9;font-weight:800;font-size:13px}
.mistake{padding:14px 0;border-top:1px solid #e7edf4;line-height:1.45} .hidden{display:none!important}
.footer{text-align:center;color:#8a96a8;font-size:12px;padding-top:22px}
@media(max-width:860px){.layout{grid-template-columns:1fr}.side{position:static;order:-1}.grid{grid-template-columns:repeat(10,1fr)}.topbar{grid-template-columns:1fr}.timer{width:100%}}
@media(max-width:600px){.shell{padding:12px 10px 34px}.hero{border-radius:18px;padding:20px}.mark{width:46px;height:46px;border-radius:13px}.hero p{font-size:13px}.topbar{padding:13px}.controls{display:grid;grid-template-columns:1fr 1fr;width:100%}.field{min-width:0}.controls .btn{width:100%}.quiz{padding:18px 15px}.q{font-size:20px}.grid{grid-template-columns:repeat(6,1fr)}.qnum{height:36px}.actions .btn{flex:1 1 42%}}
</style>
</head>
<body>
<div class="shell">
  <section class="hero">
    <div class="brand"><div class="mark">PM</div><div><h1>Simulatore ISIPM-Base</h1></div></div>
  </section>

  <section class="topbar">
    <div class="controls">
      <div class="field"><label for="count">Numero domande</label><select id="count"><option>10</option><option>30</option><option selected>60</option></select></div>
      <div class="field"><label for="mode">Modalità</label><select id="mode"><option value="live">Allenamento</option><option value="exam" selected>Simulazione d'esame</option></select></div>
      <button class="btn primary" id="newBtn">Nuovo test</button>
      <button class="btn light" id="retryBtn">Ripeti errori</button>
      <button class="btn danger" id="submitExamBtn">Consegna</button>
    </div>
    <div class="timer" id="timerBox"><div><div class="label">Tempo residuo</div><strong id="timer">90:00</strong></div><small id="answeredCount">0/60 risposte</small></div>
  </section>

  <div class="progress"><div class="bar" id="bar"></div></div>

  <div class="layout">
    <main id="quiz" class="card quiz"></main>
    <aside class="card side"><h3>Navigazione</h3><p>Puoi passare liberamente da una domanda all'altra. Le risposte selezionate restano memorizzate durante il test.</p><div id="qgrid" class="grid"></div></aside>
  </div>
  <section id="summary" class="card summary hidden"></section>
  <div class="footer">Simulatore ISIPM-Base</div>
</div>
<script>
const BANK=[{"source":"Test 11","orig_num":1,"question":"Per gestione delle informazioni NON si intende","options":[{"letter":"A","text":"Preparare i risultati nel formato richiesto"},{"letter":"B","text":"Indicare le modalità con cui le informazioni devono essere cancellate/rimosse"},{"letter":"C","text":"Raccogliere tutti i dati relativi ai consuntivi ed alle prestazioni"},{"letter":"D","text":"Rendere disponibili in modo tempestivo agli stakeholder di progetto le informazioni stabilite"}],"answer":"B","id":1},{"source":"Test 11","orig_num":2,"question":"L'assicurazione qualità fa parte:","options":[{"letter":"A","text":"Dei processi di controllo"},{"letter":"B","text":"Dei processi di pianificazione"},{"letter":"C","text":"Dei processi di chiusura"},{"letter":"D","text":"Dei processi di esecuzione"}],"answer":"D","id":2},{"source":"Test 11","orig_num":3,"question":"Il momento in cui il project manager deve compiere l’analisi di contesto è:","options":[{"letter":"A","text":"Allorché ciò venga richiesto ed esplicitato nel kick-off meeting con lo sponsor."},{"letter":"B","text":"All'inizio dei processi di avvio, e in ogni altro caso lo ritenga necessario."},{"letter":"C","text":"Prima di iniziare la pianificazione del progetto"},{"letter":"D","text":"prima della redazione del project charter, e dopo l’analisi del contesto esterno."}],"answer":"B","id":3},{"source":"Test 11","orig_num":4,"question":"Le performance economiche del progetto, in corso d'opera, vanno definite in base a:","options":[{"letter":"A","text":"I costi stimati per singola Attività"},{"letter":"B","text":"La Baseline dei costi"},{"letter":"C","text":"I costi definiti nel piano finanziario (Cash Flow)"},{"letter":"D","text":"Tutte le risposte sono corrette"}],"answer":"B","id":4},{"source":"Test 11","orig_num":5,"question":"Con Programma si intende:","options":[{"letter":"A","text":"Un gruppo di progetti e altre operazioni correlate, che concorrono al raggiungimento di un obiettivo"},{"letter":"B","text":"Un insieme di attività altamente collegate tra di loro per raggiungere un beneficio comune"},{"letter":"C","text":"Progetti e portfoli di progetti che concorrono al raggiungimento di un obiettivo"},{"letter":"D","text":"Un gruppo di progetti indipendenti tra loro gestiti dalla stessa organizzazione"}],"answer":"A","id":5},{"source":"Test 11","orig_num":6,"question":"Il livellamento a \"tempi limitati\":","options":[{"letter":"A","text":"Determina necessariamente un ritardo sulla data di fiine progetto"},{"letter":"B","text":"Non determina mai un ritardo sulla data di fine progetto"},{"letter":"C","text":"Non determina lo spostamento temporale di attività aventi Total Float maggiore di 0"},{"letter":"D","text":"Determina un ritardo di progetto ma solo se vi sono risorse in sovraccarico"}],"answer":"B","id":6},{"source":"Test 11","orig_num":7,"question":"La revisione di una Baseline rende necessaria la approvazione di quali stakeholder di progetto?","options":[{"letter":"A","text":"Tutti gli Stakeholder"},{"letter":"B","text":"Il committente"},{"letter":"C","text":"Lo Sponsor"},{"letter":"D","text":"Il Project Manager"}],"answer":"C","id":7},{"source":"Test 11","orig_num":8,"question":"Con deliverable si intende:","options":[{"letter":"A","text":"Un beneficio relativo al prodotto/servizio del progetto."},{"letter":"B","text":"Risposte A e C insieme."},{"letter":"C","text":"Un prodotto, servizio, risultato (anche parziale) previsto nel piano di progetto."},{"letter":"D","text":"Sempre un Work Package."}],"answer":"C","id":8},{"source":"Test 11","orig_num":9,"question":"Quale delle seguenti affermazioni è da ritenersi corretta?","options":[{"letter":"A","text":"Un programma può scomporsi in sottoprogetti, fasi e sottofasi"},{"letter":"B","text":"Un progetto può scomporsi in sottoprogrammi e sottofasi"},{"letter":"C","text":"Un progetto può scomporsi in sottoprogetti, fasi e sottofasi"},{"letter":"D","text":"Un sottoprogetto è la scomposizione di attività e programmi"}],"answer":"C","id":9},{"source":"Test 11","orig_num":10,"question":"In accordo allo standard ISIPM, quale tra le seguenti NON è una tecnica di problem solving:","options":[{"letter":"A","text":"Metodo del Net Present Value"},{"letter":"B","text":"Metodo cartesiano"},{"letter":"C","text":"Analisi costi/benefici"},{"letter":"D","text":"Diagramma \"\"a lisca di pesce\"\""}],"answer":"A","id":10},{"source":"Test 11","orig_num":11,"question":"A quale domanda la Matrice delle responsabilità fornisce risposta chiara ed esaustiva?","options":[{"letter":"A","text":"Chi fa, come e con che cosa?"},{"letter":"B","text":"Chi fa e con quali risorse?"},{"letter":"C","text":"Chi fa Cosa?"},{"letter":"D","text":"Chi fa con quali costi?"}],"answer":"C","id":11},{"source":"Test 11","orig_num":12,"question":"Rispetto ai seguenti valori di CPI e SPI, quale coppia indica il progetto con le migliori performace economiche?","options":[{"letter":"A","text":"CPI=1 SPI=1"},{"letter":"B","text":"CPI=0,8 SPI=1,4"},{"letter":"C","text":"CPI=0,8 SPI=0,7"},{"letter":"D","text":"CPI=1 SPI=1,2"}],"answer":"D","id":12},{"source":"Test 11","orig_num":13,"question":"Con il “Metodo del percorso critico” si ottiene :","options":[{"letter":"A","text":"Il calcolo probabilistico dei “float” (tempi di slittamento delle attività)"},{"letter":"B","text":"La stima probabilistica della durata del progetto"},{"letter":"C","text":"L'individuazione delle attività non critiche"},{"letter":"D","text":"La stima deterministica della durata del progetto"}],"answer":"D","id":13},{"source":"Test 11","orig_num":14,"question":"La qualità di progetto percepita dagli stakeholder viene misurata attraverso","options":[{"letter":"A","text":"Lettere di encomio per il project manager"},{"letter":"B","text":"Indagini di Customer Satisfation"},{"letter":"C","text":"Report di completamento lavoro"},{"letter":"D","text":"Meeting di chiusura progetto"}],"answer":"B","id":14},{"source":"Test 11","orig_num":15,"question":"Che differenza c`è fra conflitto e crisi?","options":[{"letter":"A","text":"Il conflitto è una lite latente, la crisi una lite manifesta."},{"letter":"B","text":"Conflitto: disaccordo, aumento della tensione, quando uno ritiene che i suoi interessi siano ostacolati dagli interessi dell’altro; crisi: conflitto che si blocca, si paralizza, non ha più vie d’uscita."},{"letter":"C","text":"Il conflitto è la preparazione di una crisi, che ne fa esplodere le energie potenziali."},{"letter":"D","text":"Il conflitto è una crisi meno grave. La crisi è la causa dei conflitti."}],"answer":"B","id":15},{"source":"Test 11","orig_num":16,"question":"La stima analitica dei costi di progetto è:","options":[{"letter":"A","text":"Un'analisi delle offerte dei fornitori"},{"letter":"B","text":"Una valutazione quantitativa dei costi di tipo bottom-up"},{"letter":"C","text":"Una valutazione parametrica dei costi"},{"letter":"D","text":"Una metodologia di stima dei costi di tipo top-down"}],"answer":"B","id":16},{"source":"Test 11","orig_num":17,"question":"L'assicurazione qualità coinvolge:","options":[{"letter":"A","text":"I prodotti"},{"letter":"B","text":"I processi"},{"letter":"C","text":"I rischi"},{"letter":"D","text":"Gli stakeholder"}],"answer":"B","id":17},{"source":"Test 11","orig_num":18,"question":"Il piano di gestione del progetto (Piano di Progetto) può definirsi come:","options":[{"letter":"A","text":"Il piano generale che integra tutti i sotto-piani del progetto"},{"letter":"B","text":"Un piano che descrive le regole e le procedure da seguire per la gestione del programma"},{"letter":"C","text":"Un piano di alto livello del progetto"},{"letter":"D","text":"Il documento che costituisce di norma l'allegato tecnico al Project Charter"}],"answer":"A","id":18},{"source":"Test 11","orig_num":19,"question":"Oltre al controllo del personale, quali sono le altre caratteristiche di una struttura organizzativa?","options":[{"letter":"A","text":"Interscambiabilità di ruoli, struttura matriciale, efficacia ed efficienza"},{"letter":"B","text":"sviluppo di conoscenze, flessibilità e knowledge management"},{"letter":"C","text":"sviluppo di conoscenze, flessibilità, efficacia ed efficienza dei processi"},{"letter":"D","text":"anticipo dei tempi di produzione, risparmio sui costi, comodità logistica"}],"answer":"C","id":19},{"source":"Test 11","orig_num":20,"question":"Con \"forming\" si intende:","options":[{"letter":"A","text":"La fase di formazione e conoscenza del gruppo di lavoro"},{"letter":"B","text":"Una forma di scheduling dei piani-tipo di lavoro"},{"letter":"C","text":"La fase di strutturazione del team di progetto"},{"letter":"D","text":"Una fase della formazione professionale del team"}],"answer":"A","id":20},{"source":"Test 11","orig_num":21,"question":"La definizione più appropriata di budget di progetto è:","options":[{"letter":"A","text":"La stima dei costi di progetto suddivisa per Work Package"},{"letter":"B","text":"Il risultato del processo di “budgeting & control” dell’ufficio o funzione costi e reporting del progetto "},{"letter":"C","text":"La ripartizione temporale dei costi di progetto"},{"letter":"D","text":"La stima dei costi di progetto per voce di costo"}],"answer":"C","id":21},{"source":"Test 11","orig_num":22,"question":"Allorché un project manager americano citò l’acronimo EV, intendeva:","options":[{"letter":"A","text":"Il valore del lavoro effettivamente eseguito alla data di avanzamento."},{"letter":"B","text":"Nessuno dei concetti qui presenti."},{"letter":"C","text":"I costi a consuntivo."},{"letter":"D","text":"Il budget dei costi a finire."}],"answer":"A","id":22},{"source":"Test 11","orig_num":23,"question":"Durante la pianificazione della comunicazione è necessario definire:","options":[{"letter":"A","text":"Perché, cosa, dove e quando comunicare"},{"letter":"B","text":"A chi, dove e quando comunicare"},{"letter":"C","text":"Che cosa, come e dove comunicare"},{"letter":"D","text":"Chi comunica, a chi comunicare, cosa comunicare, quando comunicare, perché comunicare, come comunicare, dove comunicare"}],"answer":"D","id":23},{"source":"Test 11","orig_num":24,"question":"Fra i principali criteri di successo del progetto assegnati al project manager non è compreso:","options":[{"letter":"A","text":"La soddisfazione degli stakehoder"},{"letter":"B","text":"Il rispetto degli Obiettivi concordati"},{"letter":"C","text":"Il successo finanziario a vita intera del progetto"},{"letter":"D","text":"Il rispetto delle scadenze temporali"}],"answer":"C","id":24},{"source":"Test 11","orig_num":25,"question":"Nelle conoscenze comportamentali, nell'ambito della negoziazione, la cooperazione si ha quando gli obiettivi della controparte sono:","options":[{"letter":"A","text":"diversi ed impliciti"},{"letter":"B","text":"legati al concetto di supremazia"},{"letter":"C","text":"diversi, ma esistono vie di accordo"},{"letter":"D","text":"simili ed espliciti"}],"answer":"D","id":25},{"source":"Test 11","orig_num":26,"question":"Nel project management con \"avvio” si definisce:","options":[{"letter":"A","text":"la fase iniziale del progetto"},{"letter":"B","text":"Un gruppo di processi che si usano nel progetto"},{"letter":"C","text":"l'attività di schedulazione delle milestone"},{"letter":"D","text":"l'analisi della fattibilità del progetto"}],"answer":"B","id":26},{"source":"Test 11","orig_num":27,"question":"Il tailoring dei processi di project management:","options":[{"letter":"A","text":"E' dettato dallo sponsor"},{"letter":"B","text":"E' responsabilità del project manager"},{"letter":"C","text":"Può essere imposto dagli stakeholder di alto potere e alto interesse"},{"letter":"D","text":"Le altre risposte presenti sono errate"}],"answer":"B","id":27},{"source":"Test 11","orig_num":28,"question":"Il documento con cui si individuano le parti costituenti un nuovo prodotto che deve essere realizzato è:","options":[{"letter":"A","text":"WBS"},{"letter":"B","text":"PPS"},{"letter":"C","text":"PBS"},{"letter":"D","text":"ABS"}],"answer":"C","id":28},{"source":"Test 11","orig_num":29,"question":"La ______________ NON è una caratteristica di un progetto. Riempire lo spazio bianco con una delle seguenti alternative.","options":[{"letter":"A","text":"Unicità"},{"letter":"B","text":"Elaborazione progressiva"},{"letter":"C","text":"Ripetibilità"},{"letter":"D","text":"Temporaneità"}],"answer":"C","id":29},{"source":"Test 11","orig_num":30,"question":"Mi trovo in una fase avanzata di progetto ed ho bisogno di approvvigionarmi di un bene i cui requisiti sono ben definiti. Vorrei preoccuparmi il meno possibile di quanto accadrà per realizzarlo. Mi affido ad un contratto:","options":[{"letter":"A","text":"Time & Material"},{"letter":"B","text":"Fixed Price"},{"letter":"C","text":"Costi e Spese"},{"letter":"D","text":"Costi e Spese + Incentivo"}],"answer":"B","id":30},{"source":"Test 11","orig_num":31,"question":"Il project charter contiene diversi elementi TRANNE:","options":[{"letter":"A","text":"I deliverable previsti"},{"letter":"B","text":"Il Project Manager assegnato"},{"letter":"C","text":"I rischi di progetto e delle sue fasi"},{"letter":"D","text":"I criteri di successo del progetto"}],"answer":"C","id":31},{"source":"Test 11","orig_num":32,"question":"Nel project management la gestione della contrattualistica in generale si riferisce:","options":[{"letter":"A","text":"Alla redazione dei contratti"},{"letter":"B","text":"Al processo di approvvigionamento solo dei beni e servizi ad alto rischio"},{"letter":"C","text":"Alle attività di supporto dell’ufficio legale al project manager"},{"letter":"D","text":"Al processo di approvvigionamento di tutti i beni e servizi necessari al progetto"}],"answer":"D","id":32},{"source":"Test 11","orig_num":33,"question":"_________________ è uno dei criteri che rende di successo la gestione di un progetto (riempire lo spazio bianco con la migliore tra le alternative)","options":[{"letter":"A","text":"L'uso efficace ed efficiente delle risorse assegnate"},{"letter":"B","text":"La chiara distinzione dei ruoli all'interno del team di progetto"},{"letter":"C","text":"La corretta definizione di una strategia di comunicazione"},{"letter":"D","text":"La verifica dei requisiti di qualità attraverso i controlli"}],"answer":"A","id":33},{"source":"Test 11","orig_num":34,"question":"Cosa indica l'acronimo AON?","options":[{"letter":"A","text":"Un grafico reticolare schedulabile solo con un algoritmo CPM"},{"letter":"B","text":"Ottimizzazione normalizzata delle attività"},{"letter":"C","text":"un insieme di nodi e archi in cui le attività di progetto sono rappresentate tramite frecce orientate"},{"letter":"D","text":"Un grafico reticolare in cui le attività sono rappresentate sui nodi"}],"answer":"D","id":34},{"source":"Test 11","orig_num":35,"question":"I processi di project management previsti dalla norma UNI ISO 21500:","options":[{"letter":"A","text":"possono essere applicati in modo ripetitivo sull'intero progetto o su una singola fase"},{"letter":"B","text":"possono essere applicati in modo ripetitivo solo su una singola fase"},{"letter":"C","text":"possono essere applicati in modo ripetitivo solo sull'ultima fase o chiusura di un progetto."},{"letter":"D","text":"possono essere applicati in modo ripetitivo solo sulla prima fase o avvio di progetto."}],"answer":"A","id":35},{"source":"Test 11","orig_num":36,"question":"In un'organizzazione di tipo ____________ il project manager ha un alto grado di autorità e indipendenza","options":[{"letter":"A","text":"Gerarchica"},{"letter":"B","text":"Funzionale"},{"letter":"C","text":"A matrice bilanciata"},{"letter":"D","text":"A progetti"}],"answer":"D","id":36},{"source":"Test 11","orig_num":37,"question":"In un istogramma di carico risorse cosa indica un \"sovraccarico\" della risorsa R1 nel periodo T1? (scegliere risposta migliore)","options":[{"letter":"A","text":"L'utilizzo della stessa risorsa R1 su due differenti attività che nel Gantt sono sovrapposte nel periodo T1."},{"letter":"B","text":"L'obbligo di una ottimizzazione dei carichi attraverso un livellamento limitato nelle risorse"},{"letter":"C","text":"Che la quantità richiesta dal progetto per la risorsa R1 supera, nel periodo T1, quella disponibile."},{"letter":"D","text":"Lo straordinario richiesto ad una risorsa umana R1 nel periodo T1"}],"answer":"C","id":37},{"source":"Test 11","orig_num":38,"question":"Quale tra i seguenti è un output dei processi di pianificazione che risponde alla domanda \"come fare\"","options":[{"letter":"A","text":"Diagramma di GANTT"},{"letter":"B","text":"Cammino critico"},{"letter":"C","text":"Reticolo logico"},{"letter":"D","text":"Stima risorse necessarie"}],"answer":"C","id":38},{"source":"Test 11","orig_num":39,"question":"Nelle conoscenze comportamentali, con “attenuazione” si intende:","options":[{"letter":"A","text":"Un modo di evitare i punti di divergenza e sottolineare i punti di convergenza, nella risoluzione dei conflitti."},{"letter":"B","text":"La rinuncia alle proprie posizioni, risolvendo in tal modo il conflitto."},{"letter":"C","text":"Un modo per cercare compromessi fra posizioni di conflitto, sottolineando i benefici per il progetto. "},{"letter":"D","text":"Un comportamento del project manager, tendente ad attenuare il conflitto con le proprie decisioni."}],"answer":"A","id":39},{"source":"Test 11","orig_num":40,"question":"L'intelligenza emotiva è una caratteristica e conoscenza comportamentale del project manager che consente di:","options":[{"letter":"A","text":"Considerare aspetti della persona complementari a quelli del lavoro (cultura, famiglia e altri)"},{"letter":"B","text":"Utilizzare tecniche di compromesso e di attenuazione i conflitti con i membri del team"},{"letter":"C","text":"Gestire con responsabilità sociale il progetto"},{"letter":"D","text":"Tener conto degli aspetti relazionali con le persone, e non solo di quelli professionali e tecnici"}],"answer":"D","id":40},{"source":"Test 11","orig_num":41,"question":"Un progetto può essere chiuso prima del previsto:","options":[{"letter":"A","text":"Nel caso il PM lo ritenesse corretto"},{"letter":"B","text":"nel caso in cui i clienti non richiedano più i deliverable già prodotti"},{"letter":"C","text":"Qualora viene richiesta una variazione dell'ambito tale da mettere in discussione la motivazione stessa per la quale è nato il progetto o cambia radicalmente la natura iniziale del prodotto del progetto"},{"letter":"D","text":"Quando i costi ed i tempi superano il livello di pericolo."}],"answer":"C","id":41},{"source":"Test 11","orig_num":42,"question":"Le attività di integrazione, eseguite dal Responsabile di Progetto, NON comprendono le attività necessarie:","options":[{"letter":"A","text":"per eseguire il piano;"},{"letter":"B","text":"per apportare modifiche al piano."},{"letter":"C","text":"per sviluppare un piano di progetto"},{"letter":"D","text":"per cancellare un piano di progetto"}],"answer":"D","id":42},{"source":"Test 11","orig_num":43,"question":"Nel corso di un progetto di sviluppo software molto difficile, il PM sostituì un programmatore con un altro più esperto. Con tale azione si volle in pratica:","options":[{"letter":"A","text":"Trasferire il rischio"},{"letter":"B","text":"Eliminare il rischio"},{"letter":"C","text":"Pianificare la risposta al rischio"},{"letter":"D","text":"Mitigare il rischio"}],"answer":"D","id":43},{"source":"Test 11","orig_num":44,"question":"Tutti i seguenti sono aspetti coinvolti nella attività svolte nei processi di controllo di un progetto, tranne uno. Individuatelo.","options":[{"letter":"A","text":"Contrattuali"},{"letter":"B","text":"Legali"},{"letter":"C","text":"Economici"},{"letter":"D","text":"Gestionali di un programma"}],"answer":"D","id":44},{"source":"Test 11","orig_num":45,"question":"Con CV (Cost Variance) si indica:","options":[{"letter":"A","text":"EV - PV"},{"letter":"B","text":"EV / AC"},{"letter":"C","text":"EV - AC"},{"letter":"D","text":"Nessuna delle risposte elencate è corretta."}],"answer":"C","id":45},{"source":"Test 11","orig_num":46,"question":"Scegliere tra le seguenti quelle caratteristiche che NON rimandano al concetto di leadership.","options":[{"letter":"A","text":"La capacità di influenzare e convincere le persone, allo scopo di indurre il consenso a conseguire determinati obiettivi."},{"letter":"B","text":"Avere specifiche abilità di carattere personale, relazionale, pensiero strategico, creativo e sistemico. "},{"letter":"C","text":"Essere in grado di guidare un gruppo di persone grazie all’autorità e autorevolezza."},{"letter":"D","text":"Rifiutarsi di sostituirsi ai membri del team di progetto per apparire un pari tra i pari, perché il governo del progetto deve attuarsi sempre facendo ricorso alla delega"}],"answer":"D","id":46},{"source":"Test 11","orig_num":47,"question":"Identificare i rischi di un progetto significa:","options":[{"letter":"A","text":"Individuare e descrivere i rischi valutandone il danno e la probabilità di accadimento"},{"letter":"B","text":"Individuare e descrivere i rischi valutandone il danno potenziale"},{"letter":"C","text":"Individuare e descrivere i rischi pianificando le azioni di risposta"},{"letter":"D","text":"Individuare e descrivere i rischi"}],"answer":"D","id":47},{"source":"Test 11","orig_num":48,"question":"Cosa è necessario associare ad ogni Work Package (WP) ?","options":[{"letter":"A","text":"Gli output di fine fase associati"},{"letter":"B","text":"Gli Stakeholder di riferimento"},{"letter":"C","text":"L'organizzazione del progetto"},{"letter":"D","text":"Un output misurabile e controllabile"}],"answer":"D","id":48},{"source":"Test 11","orig_num":49,"question":"Chi autorizza il progetto e risolve problemi e conflitti che vanno oltre l'autorità del project manager?","options":[{"letter":"A","text":"Sponsor di progetto"},{"letter":"B","text":"Direzione progetti"},{"letter":"C","text":"Committente del progetto"},{"letter":"D","text":"Lo steering board (comitato di guida) del progetto"}],"answer":"A","id":49},{"source":"Test 11","orig_num":50,"question":"La struttura organizzativa di un progetto viene rappresentata attraverso","options":[{"letter":"A","text":"OMR (Organization Matrix Responsability)"},{"letter":"B","text":"OBS (Organization Breakdown Structure)"},{"letter":"C","text":"WBS (Work Breakdown Structure)"},{"letter":"D","text":"POS (Project Organization Structure)"}],"answer":"B","id":50},{"source":"Test 11","orig_num":51,"question":"Nella gestione di un progetto, l'integrazione comprende i processi necessari per ______________?","options":[{"letter":"A","text":"identificare e definire il lavoro e i deliverable, e tutto e solo il lavoro e i deliverable richiesti."},{"letter":"B","text":"eseguire la programmazione delle attività di progetto e monitorare l’avanzamento al fine di controllare lo stesso programma temporale."},{"letter":"C","text":"individuare, definire, combinare, unificare, coordinare, controllare e chiudere le diverse attività e processi relativi al progetto."},{"letter":"D","text":"identificare e relazionarsi con lo sponsor, i clienti e tutte le parti interessate del progetto"}],"answer":"C","id":51},{"source":"Test 11","orig_num":52,"question":"Quale è la definizione più corretta di orientamento al risultato?","options":[{"letter":"A","text":"L'attitudine, generalmente positiva, di operare nelle modalità ritenute più idonee per il raggiungimento di un obiettivo prefissato"},{"letter":"B","text":"L'abitudine ad operare con maggiore efficacia da soli che in gruppo"},{"letter":"C","text":"La capacità di realizzare i propri obiettivi in qualunque condizione"},{"letter":"D","text":"L'attitudine al calcolo logico-matematico"}],"answer":"A","id":52},{"source":"Test 11","orig_num":53,"question":"Nel project management con “Actual Cost” (AC) si definisce:","options":[{"letter":"A","text":"L’attuale stima del costo totale a finire del progetto"},{"letter":"B","text":"Il costo totale effettivamente sostenuto alla data di rilevazione dell’avanzamento"},{"letter":"C","text":"Il costo totale previsto nella baseline alla data di avanzamento"},{"letter":"D","text":"I due punti fondamentali di controllo avanzamento della curva Earned Value"}],"answer":"B","id":53},{"source":"Test 11","orig_num":54,"question":"Il Program Management Office è un ufficio con il compito di?","options":[{"letter":"A","text":"Supportare il Program Manager nelle attività di programma e definire metodi, procedure e standard che devono essere adottati da tutti i programmi e progetti che ne fanno parte"},{"letter":"B","text":"Supportare l'attività dei project manager e dei program manager dell'azienda nel raggiungimento degli obiettivi assegnati"},{"letter":"C","text":"essere l'ufficio del Program Manager"},{"letter":"D","text":"supportare lo steering committe nelle decisioni aziendali"}],"answer":"A","id":54},{"source":"Test 11","orig_num":55,"question":"Nel corso di formazione di fine progetto, dedicato alla manutenzione e installazione, il formatore si trovo in difficoltà, a causa della incompletezza del manuale utente. Scegliere la motivazione più probabile.","options":[{"letter":"A","text":"L'inesperienza dell’organizzazione nelle attività formative"},{"letter":"B","text":"Un processo di gestione della configurazione non idoneo e poco efficace"},{"letter":"C","text":"Una scarsa attenzione degli utenti a seguire le sessioni di addestramento"},{"letter":"D","text":"Una scarsa definizione del documento di specifiche dei requisiti"}],"answer":"B","id":55},{"source":"Test 11","orig_num":56,"question":"Con mandato di progetto si intende il documento:","options":[{"letter":"A","text":"sottoscritto dallo sponsor/committente che innesta il processo di Avvio"},{"letter":"B","text":"in cui si definiscono le responsabilità e i ruoli dei componenti dell'intero team di progetto"},{"letter":"C","text":"realizzato al termine del processo di pianificazione del progetto"},{"letter":"D","text":"con cui si convoca il \"kick off\" meeting"}],"answer":"A","id":56},{"source":"Test 11","orig_num":57,"question":"Nel metodo CPM si individua con il termine “Cammino Critico”:","options":[{"letter":"A","text":"La sequenza delle attività che determina la durata del progetto"},{"letter":"B","text":"La somma delle durate deterministiche delle attività di progetto"},{"letter":"C","text":"La lista delle attività “critiche”, vale a dire con più rischi"},{"letter":"D","text":"La sequenza delle attività che determina il costo maggiore del progetto"}],"answer":"A","id":57},{"source":"Test 11","orig_num":58,"question":"Il piano di gestione della comunicazione comprende:","options":[{"letter":"A","text":"Le regole di negoziazione, comportamento e \"team working\""},{"letter":"B","text":"Lo sponsor, il project manager, il project team e tutte le altre funzioni aziendali interessate al progetto "},{"letter":"C","text":"Lo sponsor, il project team, i clienti, le altre funzioni aziendali interessate al progetto"},{"letter":"D","text":"Tutte le parti interessate al progetto"}],"answer":"D","id":58},{"source":"Test 11","orig_num":59,"question":"Sponsor di un progetto è (scegliere la risposta migliore):","options":[{"letter":"A","text":"La persona che si assume l'impegno globale del progetto"},{"letter":"B","text":"Il Committente"},{"letter":"C","text":"Il comitato di direzione dell'azienda"},{"letter":"D","text":"L'utente finale dei prodotti/servizi rilasciati dal progetto"}],"answer":"A","id":59},{"source":"Test 11","orig_num":60,"question":"A chi viene assegnato il compito principale di integrare le componenti variabili di un progetto?","options":[{"letter":"A","text":"Al Project Manager"},{"letter":"B","text":"Al Team di progetto"},{"letter":"C","text":"Al Manager funzionale da cui dipende il Project Manager"},{"letter":"D","text":"Allo Sponsor di Progetto"}],"answer":"A","id":60},{"source":"Simulazione 2024","orig_num":1,"question":"Nel triplo vincolo, tempi-costi-qualità, la qualità fa riferimento alla:","options":[{"letter":"A","text":"Qualità esclusivamente derivata dalle norme ISO"},{"letter":"B","text":"Qualità delle risorse impiegate nel processo produttivo"},{"letter":"C","text":"Costi necessari a correggere i difetti del prodotto"},{"letter":"D","text":"Qualità del prodotto ottenuto e del project management necessario ad ottenerlo"}],"answer":"D","id":61},{"source":"Simulazione 2024","orig_num":2,"question":"Una metodologia di project management è considerata di successo se:","options":[{"letter":"A","text":"Sono rispettati i tempi e i costi di un progetto, anche non ottenendo il massimo livello di qualità desiderato"},{"letter":"B","text":"Permette di utilizzare le risorse assegnate in maniera efficace ed efficiente"},{"letter":"C","text":"Il PM segue pedissequamente le linee guida della metodologia scelta per gestire il progetto"},{"letter":"D","text":"Il PM ha delegato al minimo le attività e centralizzato le decisioni più importanti"}],"answer":"B","id":62},{"source":"Simulazione 2024","orig_num":3,"question":"Perché un progetto dovrebbe essere influenzato dal tipo di struttura organizzativa che caratterizza l'organizzazione ospitante?","options":[{"letter":"A","text":"Perché il PM è costretto a seguire le procedure di qualità definite dall'organizzazione"},{"letter":"B","text":"Perché una struttura molto rigida non consente al PM di utilizzare al meglio le sue soft skill"},{"letter":"C","text":"Perché il PM sarà costretto ad adottare la stessa struttura anche nella gestione del suo progetto"},{"letter":"D","text":"Perché sono vincolanti le caratteristiche dei canali informativi e le diverse linee di autorità che interconnettono le diverse funzioni coinvolte nel progetto"}],"answer":"D","id":63},{"source":"Simulazione 2024","orig_num":4,"question":"Le strutture organizzative che interessano la gestione di progetto stabiliscono i criteri che sovrintendono al:","options":[{"letter":"A","text":"Controllo di gestione"},{"letter":"B","text":"Coordinamento delle attività e interdipendenza dei ruoli"},{"letter":"C","text":"Sistema informativo \"Human Resources\""},{"letter":"D","text":"Gestione del progetto"}],"answer":"B","id":64},{"source":"Simulazione 2024","orig_num":5,"question":"Tra le attività di portfolio management vi sono:","options":[{"letter":"A","text":"Selezione progetti e programmi e assegnazione di priorità in funzione degli obiettivi strategici"},{"letter":"B","text":"Controllo dell'avanzamento delle attività di progetto"},{"letter":"C","text":"Controllo dell'avanzamento delle attività di programma"},{"letter":"D","text":"Approvazione delle sole iniziative che presentano un alto grado di correlazione tra loro"}],"answer":"A","id":65},{"source":"Simulazione 2024","orig_num":6,"question":"Un piano strategico che preveda l'aumento del 10% delle vendite nei mercati consolidati europei e l'entrata in un nuovo mercato del sud est asiatico darà luogo a:","options":[{"letter":"A","text":"Due progetti distinti"},{"letter":"B","text":"Un programma"},{"letter":"C","text":"Un portfolio di progetti"},{"letter":"D","text":"Non necessariamente a qualcosa, perché si tratta solo di un desiderata strategico"}],"answer":"C","id":66},{"source":"Simulazione 2024","orig_num":7,"question":"Grazie al \"tailoring\", il PM:","options":[{"letter":"A","text":"Definisce la politica della qualità dell'organizzazione"},{"letter":"B","text":"Può modificare le variabili di contesto del progetto"},{"letter":"C","text":"Definisce quali processi utilizzare per il progetto e il loro grado di adattamento"},{"letter":"D","text":"Può selezionare gli stakeholder con cui intraprendere una proficua relazione nel progetto"}],"answer":"C","id":67},{"source":"Simulazione 2024","orig_num":8,"question":"Il rilascio del Project Charter:","options":[{"letter":"A","text":"Sancisce il completamento dell'avvio di ogni fase del progetto"},{"letter":"B","text":"Sancisce l'inizio della giustificazione iniziale del progetto"},{"letter":"C","text":"Rappresenta il documento più semplice per la definizione del reticolo di progetto"},{"letter":"D","text":"Delinea i rapporti di forza nell'organizzazione a cui appartiene lo sponsor"}],"answer":"A","id":68},{"source":"Simulazione 2024","orig_num":9,"question":"Il Project Charter:","options":[{"letter":"A","text":"È anche detto Scheda Progetto"},{"letter":"B","text":"È utilizzato per ufficializzare la nascita di un progetto, appartiene ai processi di avvio, il cui rilascio ne sancisce il completamento"},{"letter":"C","text":"Contiene informazioni circa le motivazioni e la giustificazione di un progetto (compresi anche nel business case)"},{"letter":"D","text":"Tutte le risposte sono corrette"}],"answer":"D","id":69},{"source":"Simulazione 2024","orig_num":10,"question":"Le milestone:","options":[{"letter":"A","text":"Possono avere durata pari a 0 se non comportano verifiche da effettuare. Alle volte, possono avere una durata diversa da zero in funzione della durata dei controlli da effettuare sul progetto definiti per quel momento"},{"letter":"B","text":"Sono sempre delle scadenze verso il cliente nelle quali c'è il rilascio di un deliverable"},{"letter":"C","text":"Possono essere delle scadenze definite con il cliente con il rilascio di un deliverable, ma possono anche rappresentare dei momenti di controllo interno che il PM decide di inserire in un piano di progetto"},{"letter":"D","text":"Rappresentano il momento in cui si chiude una fase e si apre la successiva"}],"answer":"C","id":70},{"source":"Simulazione 2024","orig_num":11,"question":"La baseline è necessaria:","options":[{"letter":"A","text":"Nell'analisi dei dati storici del progetto, in quanto non consente la formulazione di stime a finire"},{"letter":"B","text":"Per verificare gli scostamenti effettivo/pianificato e nella misurazione delle performance di progetto"},{"letter":"C","text":"Allo sponsor per reperire i fondi necessari al finanziamento del progetto"},{"letter":"D","text":"Perché consigliata da diverse metodologie di project management, anche se nella realtà la sua utilità è relativa"}],"answer":"B","id":71},{"source":"Simulazione 2024","orig_num":12,"question":"Quale tecnica di compressione della schedulazione del progetto consente di modificare la logica del reticolo per sovrapporre le fasi che verrebbero in genere svolte in sequenza, come la fase di progettazione e quella di costruzione, o per eseguire in parallelo le attività schedulate?","options":[{"letter":"A","text":"La tecnica del Crashing"},{"letter":"B","text":"La tecnica del Metodo del Percorso Critico"},{"letter":"C","text":"La tecnica del Multitasking"},{"letter":"D","text":"La tecnica del Fast Tracking"}],"answer":"D","id":72},{"source":"Simulazione 2024","orig_num":13,"question":"Durante la pianificazione è opportuno:","options":[{"letter":"A","text":"Comprimere al massimo il tempo di sviluppo dei piani per dare spazio alle attività di sviluppo"},{"letter":"B","text":"Coinvolgere gli stakeholder esperti e coloro che dovranno realizzare le attività di progetto"},{"letter":"C","text":"Non delegare ai membri del gruppo attività sui piani, fino al momento in cui questi non siano approvati"},{"letter":"D","text":"Non tener conto dei suggerimenti di chi svolge attività operative, lasciando invece spazio agli esperti di pianificazione"}],"answer":"B","id":73},{"source":"Simulazione 2024","orig_num":14,"question":"La distribuzione dei dati riguardanti l'avanzamento lavori e di tutte le informazioni da rendere note ai diversi stakeholder viene eseguita secondo quanto:","options":[{"letter":"A","text":"deciso in sede di SAL dal Project Manager"},{"letter":"B","text":"previsto nel Project Charter"},{"letter":"C","text":"stabilito dal piano di gestione della comunicazione"},{"letter":"D","text":"imposto in sede di SAL dal Project Manager e condiviso ed approvato dallo Sponsor"}],"answer":"C","id":74},{"source":"Simulazione 2024","orig_num":15,"question":"L'identificazione degli scostamenti dal piano dà luogo normalmente a:","options":[{"letter":"A","text":"Azioni correttive"},{"letter":"B","text":"Analisi qualitativa dei rischi"},{"letter":"C","text":"Definizione di nuove baseline"},{"letter":"D","text":"Coinvolgimento degli stakeholder"}],"answer":"A","id":75},{"source":"Simulazione 2024","orig_num":16,"question":"L'aggiornamento della baseline:","options":[{"letter":"A","text":"È un'attività che il PM può decidere in modo autonomo"},{"letter":"B","text":"Dipende da attività appartenenti a processi e procedure ben definite per il controllo della configurazione"},{"letter":"C","text":"Se lo sponsor autorizza, può essere superato il blocco eventualmente posto da processi e procedure relative al controllo della configurazione"},{"letter":"D","text":"Non deve mai essere effettuato in un progetto"}],"answer":"B","id":76},{"source":"Simulazione 2024","orig_num":17,"question":"L'incontro volto ad esaminare approfonditamente i risultati conseguiti in un progetto, evidenziandone i punti di forza e di debolezza è detto:","options":[{"letter":"A","text":"Kick Off Meeting"},{"letter":"B","text":"End of Project Meeting"},{"letter":"C","text":"Close Out Meeting"},{"letter":"D","text":"Close Up Feedback Meeting"}],"answer":"C","id":77},{"source":"Simulazione 2024","orig_num":18,"question":"L'analisi SWOT:","options":[{"letter":"A","text":"Consente una visione integrata del contesto interno e del contesto esterno che incidono fortemente sul progetto"},{"letter":"B","text":"Rappresenta la base su cui determinare il calcolo delle riserve di contingency del progetto"},{"letter":"C","text":"In un secondo momento permette la tracciatura della curva ad S del budget"},{"letter":"D","text":"Chiarisce cosa il gruppo di progetto non riesce a realizzare internamente e deve acquisire all'esterno"}],"answer":"A","id":78},{"source":"Simulazione 2024","orig_num":19,"question":"Il rispetto degli obiettivi concordati e la copertura dei requisiti funzionali importanti per il progetto sono esempi di:","options":[{"letter":"A","text":"Estrema facilità del progetto"},{"letter":"B","text":"Ottima selezione delle risorse di gestione del progetto"},{"letter":"C","text":"Condizioni fortunate al contorno del progetto stesso"},{"letter":"D","text":"Criteri di successo del progetto"}],"answer":"D","id":79},{"source":"Simulazione 2024","orig_num":20,"question":"Il ruolo del Project Manager:","options":[{"letter":"A","text":"Comprende le azioni riguardanti: la cosiddetta mobilitazione del team di progetto, l’approccio gestionale, la governance operativa e le attività di pianificazione."},{"letter":"B","text":"Comprende la gestione delle performance del progetto durante tutto il ciclo di vita (attività di controllo progetto) e delle attività di inizio, avanzamento e chiusura di ciascuna fase e di ciascun work package"},{"letter":"C","text":"Comprende la gestione della realizzazione dei prodotti (cosiddetto delivery) e della chiusura del progetto."},{"letter":"D","text":"Tutte le risposte sono corrette"}],"answer":"D","id":80},{"source":"Simulazione 2024","orig_num":21,"question":"L'integrazione nel project management NON comprende le attività necessarie:","options":[{"letter":"A","text":"per sviluppare un piano di progetto"},{"letter":"B","text":"per cancellare un piano di progetto"},{"letter":"C","text":"per eseguire il piano;"},{"letter":"D","text":"per apportare modifiche al piano."}],"answer":"B","id":81},{"source":"Simulazione 2024","orig_num":22,"question":"Si considerano stakeholder:","options":[{"letter":"A","text":"Tutti coloro che in qualche maniera hanno un interesse verso il progetto"},{"letter":"B","text":"Tutti coloro che sono influenzati positivamente o negativamente dal progetto o che ritengono (a ragione o meno) di esserne influenzati"},{"letter":"C","text":"Tutti coloro che possono dare una mano al progetto"},{"letter":"D","text":"Tutti coloro che vivono nel contesto del progetto"}],"answer":"B","id":82},{"source":"Simulazione 2024","orig_num":23,"question":"Realizzare un deliverable di progetto:","options":[{"letter":"A","text":"È un output dei processi di esecuzione"},{"letter":"B","text":"È un output dei processi di supporto"},{"letter":"C","text":"È compito dei membri del project team"},{"letter":"D","text":"Le altre risposte presenti sono errate"}],"answer":"C","id":83},{"source":"Simulazione 2024","orig_num":24,"question":"La mancata individuazione di uno stakeholder fondamentale per il progetto:","options":[{"letter":"A","text":"Potrebbe comportare rischi futuri sul progetto al momento dell'accettazione del prodotto"},{"letter":"B","text":"Non è responsabilità del project manager"},{"letter":"C","text":"Su decine di stakeholder non è un problema dimenticare qualcuno"},{"letter":"D","text":"E' un problema risolvibile attraverso la sua eliminazione dal Registro degli Stakeholder"}],"answer":"A","id":84},{"source":"Simulazione 2024","orig_num":25,"question":"L’integrazione nel project management …","options":[{"letter":"A","text":"Comprende solo i processi necessari per unificare e coordinare le attività del progetto che fanno riferimento al triplo vincolo (ambito, tempi, costi)"},{"letter":"B","text":"Non riguarda le decisioni su dove e come concentrare le risorse a disposizione"},{"letter":"C","text":"Comprende le attività necessarie per individuare, definire, combinare, unificare, coordinare, controllare e chiudere le diverse attività del progetto"},{"letter":"D","text":"Si riferisce all'integrazione delle variabili del contesto esterno all'interno del progetto"}],"answer":"C","id":85},{"source":"Simulazione 2024","orig_num":26,"question":"L’approccio sistemico consente al responsabile di progetto di effettuare opportune scelte strategiche tra obiettivi e alternative, anche in eventuale contrasto tra loro, perché:","options":[{"letter":"A","text":"Tutte le risposte sono esatte"},{"letter":"B","text":"Per definire la migliore allocazione delle risorse"},{"letter":"C","text":"Per soddisfare in modo efficace le aspettative del cliente"},{"letter":"D","text":"Per prevedere potenziali questioni prima che diventino critiche"}],"answer":"A","id":86},{"source":"Simulazione 2024","orig_num":27,"question":"Le esclusioni dall'ambito del progetto:","options":[{"letter":"A","text":"Non è necessario che vengano rese esplicite perché tutto ciò che non è compreso nella descrizione dell'ambito del progetto è necessariamente escluso"},{"letter":"B","text":"Quando si fornisce un prodotto al cliente è necessario considerare la sua descrizione in senso estensivo e anche se qualcosa non è descritto deve essere fornito ugualmente"},{"letter":"C","text":"Daranno sicuramente luogo a delle richieste di modifica da parte del cliente"},{"letter":"D","text":"È bene che vengano chiaramente esplicitate nella descrizione dell'ambito del progetto per non generare incomprensioni"}],"answer":"D","id":87},{"source":"Simulazione 2024","orig_num":28,"question":"Le eventuali variazioni al lavoro previsto nel progetto:","options":[{"letter":"A","text":"Superato il 75% dell'esecuzione del progetto non potranno più essere accettate"},{"letter":"B","text":"Dovranno essere gestite tramite i processi di gestione delle modifiche e controllo della configurazione"},{"letter":"C","text":"Potranno essere processate dal Project Manager, senza grandi formalismi, semplicemente ascoltando le richieste degli stakeholder e valutando i rischi attraverso la lunga esperienza sul campo"},{"letter":"D","text":"Non potranno essere accolte nel momento in cui modificano una baseline"}],"answer":"B","id":88},{"source":"Simulazione 2024","orig_num":29,"question":"Nella preparazione della WBS ottimale, si dovrebbe scendere ad un livello di scomposizione di dettaglio (WP) in grado di identificare:","options":[{"letter":"A","text":"Un unico responsabile"},{"letter":"B","text":"Una sola risorsa che vi lavora"},{"letter":"C","text":"Un grado di soddisfazione del cliente più alto di quello pattuito nella descrizione dell'ambito"},{"letter":"D","text":"Maggiori savings sul progetto"}],"answer":"A","id":89},{"source":"Simulazione 2024","orig_num":30,"question":"L'ottimizzazione o livellamento delle risorse appartiene al processo:","options":[{"letter":"A","text":"Identificazione e sequenzializzazione delle attività di progetto"},{"letter":"B","text":"Stima delle durate delle attività"},{"letter":"C","text":"Controllo dei tempi"},{"letter":"D","text":"Programmazione temporale o schedulazione delle attività"}],"answer":"D","id":90},{"source":"Simulazione 2024","orig_num":31,"question":"Nel reticolo di programmazione AOA (Activity on Arc):","options":[{"letter":"A","text":"Le attività sono rappresentate sugli archi, le frecce indicano le relazioni e le dipendenze, mentre i nodi rappresentano le attività"},{"letter":"B","text":"Le relazioni e le dipendenze sono rappresentate sugli archi, le frecce indicano le attività, mentre i nodi rappresentano le attività"},{"letter":"C","text":"Le attività e le frecce hanno lo stesso valore, mentre i nodi rappresentano le attività"},{"letter":"D","text":"Le attività sono rappresentate sugli archi, le frecce indicano le attività, mentre i nodi rappresentano le relazioni e le dipendenze"}],"answer":"D","id":91},{"source":"Simulazione 2024","orig_num":32,"question":"Il processo Identificazione e sequenzializzazione delle attività di progetto:","options":[{"letter":"A","text":"Identifica le attività e individua i legami logici tra le attività stesse, per arrivare al disegno del reticolo logico di progetto"},{"letter":"B","text":"Individua le attività, stima la loro durata e i legami logici tra le attività stesse, per arrivare al disegno del reticolo logico di progetto"},{"letter":"C","text":"Identifica le attività e definisce i dettagli da inserire nel Dizionario della WBS"},{"letter":"D","text":"Non si applica a tutti i progetti, ma solo a quelli più complessi"}],"answer":"A","id":92},{"source":"Simulazione 2024","orig_num":33,"question":"Il calcolo della disponibilità di ciascuna tipologia di risorsa sul progetto deve far riferimento a:","options":[{"letter":"A","text":"Numero di progetti su cui è impegnata e costo di utilizzo"},{"letter":"B","text":"Capacità personali e quantità disponibile nel periodo"},{"letter":"C","text":"Periodo e quantità disponibile nel periodo"},{"letter":"D","text":"Periodo e costo da sopportare nel periodo"}],"answer":"C","id":93},{"source":"Simulazione 2024","orig_num":34,"question":"La tipologia di contratto più appropriato viene individuata sulla base di:","options":[{"letter":"A","text":"Numerosità di consegne da effettuare"},{"letter":"B","text":"Paese di appartenenza del fornitore e dell'acquirente"},{"letter":"C","text":"numerosità di fornitori che intervengono in un progetto"},{"letter":"D","text":"Complessità del bene/servizio richiesto e/o rischio che si vuole assumere"}],"answer":"D","id":94},{"source":"Simulazione 2024","orig_num":35,"question":"I contratti a misura:","options":[{"letter":"A","text":"Possono essere applicati solo alle lavorazioni che sviluppano prodotti in metri lineari"},{"letter":"B","text":"Non possono essere applicati ai contratti che superano alcune soglie di importo prefissato"},{"letter":"C","text":"Sono contratti che applicano un rapporto pari a 2:1 tra prestazioni del fornitore e somme pagate dall'acquirente"},{"letter":"D","text":"Sono applicati laddove è possibile fissare un prezzo unitario per ogni unità di deliverable"}],"answer":"D","id":95},{"source":"Simulazione 2024","orig_num":36,"question":"Che tipo di approccio va seguito nella identificazione del rischio?","options":[{"letter":"A","text":"Un approccio \"one shot\", ovvero una volta soltanto, all'inizio del progetto"},{"letter":"B","text":"Un approccio metodico di ricerca sistematica dei rischi all’interno dei diversi elementi del progetto"},{"letter":"C","text":"Un approccio \"one shot\", ovvero una volta soltanto, all'inizio di ciascuna fase del progetto"},{"letter":"D","text":"Un approccio superficiale, in quanto gli elementi raccolti in questo processo saranno analizzati approfonditamente nel processo di analisi qualitativa/quantitativa e nel processo di controllo dei rischi"}],"answer":"B","id":96},{"source":"Simulazione 2024","orig_num":37,"question":"Che cosa si indica con la notazione \"\"potenziale beneficio\"\"?","options":[{"letter":"A","text":"Il beneficio che un rischio positivo può portare solo se il progetto viene condotto a termine"},{"letter":"B","text":"Il beneficio che un rischio può portare se la sua probabilità di accadere è 100%"},{"letter":"C","text":"Il beneficio che un rischio può portare se il suo impatto è classificato come \"\"alto\"\""},{"letter":"D","text":"Il prodotto tra probabilità di un rischio e il suo impatto, quando il rischio è positivo"}],"answer":"D","id":97},{"source":"Simulazione 2024","orig_num":38,"question":"Quando la gestione finanziaria del progetto assume particolare rilevanza?","options":[{"letter":"A","text":"Nel caso di progetti a forte impatto sociale"},{"letter":"B","text":"Nel caso del ricorso al project financing, strumento di coinvolgimento di soggetti privati e di istituti bancari nel finanziamento di un progetto"},{"letter":"C","text":"Quando il budget del progetto supera i tre milioni di euro"},{"letter":"D","text":"Nel caso di costo del denaro molto elevato"}],"answer":"B","id":98},{"source":"Simulazione 2024","orig_num":39,"question":"Per gestione dei costi si intende l'insieme delle attività volte a:","options":[{"letter":"A","text":"Stimare il budget di progetto"},{"letter":"B","text":"Evitare che AC superi l'EV in ogni momento del progetto"},{"letter":"C","text":"Stimare i costi previsti per ciascun elemento, definire la loro distribuzione temporale, controllare i valori stimati rispetto ai valori effettivi, in modo da analizzare gli scostamenti rispetto alle stime, e valutare i costi a finire"},{"letter":"D","text":"Individuare la risorsa del team di project management più esperta nella gestione dei costi e concederle le relative deleghe perché essa operi in autonomia"}],"answer":"C","id":99},{"source":"Simulazione 2024","orig_num":40,"question":"La gestione delle modifiche di progetto, individuare la risposta ERRATA:","options":[{"letter":"A","text":"È l’attività che deve costantemente tenere sotto controllo le modifiche, che sia necessario apportare in corso d’opera al progetto, di modo che se ne preservi la congruenza, l’integrazione, il coordinamento e il controllo in ogni suo aspetto."},{"letter":"B","text":"Impattano di norma sull’ambito e possono riguardare: risposte a specifiche esigenze, nuove attività necessarie a risolvere scostamenti rispetto alle performance previste per alcuni componenti e/o deliverable"},{"letter":"C","text":"Il fine è di garantire che il progetto rimanga allineato agli obiettivi degli stakeholder."},{"letter":"D","text":"È la correzione di errori o rispetto di conformità dei deliverable secondo quanto definito nei piani di qualità del progetto"}],"answer":"D","id":100},{"source":"Simulazione 2024","orig_num":41,"question":"Il Budget at Completion:","options":[{"letter":"A","text":"È il BAC, ovvero il valore del lavoro effettivamente eseguito alla data di avanzamento"},{"letter":"B","text":"È la stima del costo totale di progetto"},{"letter":"C","text":"È uguale al valore dell'EAC quando i costi effettivamente sostenuti sono maggiori di quelli stimati nella definizione del budget"},{"letter":"D","text":"È il valore, in termini di costi effettivi, del lavoro effettivamente eseguito alla data di avanzamento"}],"answer":"B","id":101},{"source":"Simulazione 2024","orig_num":42,"question":"Il metodo dell'Earned Value:","options":[{"letter":"A","text":"È l'unico metodo riconosciuto dagli standard internazionali per la valutazione delle performance di un progetto"},{"letter":"B","text":"Consente di portare il progetto a termine, con una probabilità pari almeno al 90%"},{"letter":"C","text":"Fornisce proattivamente dei segnali di allarme in caso di criticità, permettendo di intraprendere azioni correttive e di supportare le decisioni"},{"letter":"D","text":"Abbatte completamente il livello di rischio di un progetto"}],"answer":"C","id":102},{"source":"Simulazione 2024","orig_num":43,"question":"Tra le attività operative attraverso cui gestire le comunicazioni di progetto si riconoscono:","options":[{"letter":"A","text":"La raccolta e l’analisi dei dati, l'approvazione da parte del Project Manager e la distribuzione delle informazioni a tutti gli stakeholder"},{"letter":"B","text":"La raccolta di tutti i dati relativi ai consuntivi e alle prestazioni, l’analisi dei dati con gli strumenti adeguati, la preparazione dei risultati nel formato richiesto, la distribuzione delle informazioni a tutti gli stakeholder, secondo quanto previsto dal piano della comunicazione"},{"letter":"C","text":"Le attività con cui gestire le comunicazioni di progetto non possono essere preordinate, ma dipendono dalla particolare situazione che il progetto attraversa e dalla tipologia di dati in quel momento disponibili"},{"letter":"D","text":"È il Project Manager che, in base alle necessità contingenti, organizza la raccolta, il trattamento e la distribuzione delle informazioni"}],"answer":"B","id":103},{"source":"Simulazione 2024","orig_num":44,"question":"Per la corretta gestione delle comunicazioni con tutti gli stakeholder coinvolti, cosa si ritiene indispensabile?","options":[{"letter":"A","text":"La disponibilità delle informazioni e della documentazione e la condivisione delle stesse con gli stakeholder interessati, nelle modalità di invio/ricezione concordate e nei tempi pianificati"},{"letter":"B","text":"La massima disponibilità degli stakeholder al dialogo"},{"letter":"C","text":"Il ricorso alla delega da parte del Project Manager, in quanto non è efficiente l'accentramento della gestione delle comunicazioni"},{"letter":"D","text":"La disponibilità di mezzi di comunicazione social, di nuova generazione"}],"answer":"A","id":104},{"source":"Simulazione 2024","orig_num":45,"question":"Quale è il fine dell'assicurazione di qualità?","options":[{"letter":"A","text":"Monitorare in modo continuo gli obiettivi di qualità dei prodotti e dei servizi"},{"letter":"B","text":"Definire le azioni correttive per correggere eventuali deviazioni dalla qualità perseguita"},{"letter":"C","text":"Non verificare l'applicazione dei requisiti di qualità ai processi, ma solo ai deliverable del progetto"},{"letter":"D","text":"Facilitare e consentire la conformità ai requisiti di prestazione, ai processi e alle norme di qualità applicabili"}],"answer":"D","id":105},{"source":"Simulazione 2024","orig_num":46,"question":"Sviluppare il gruppo di progetto ha come output:","options":[{"letter":"A","text":"Azioni correttive"},{"letter":"B","text":"Richieste di modifica"},{"letter":"C","text":"Prestazioni del gruppo di progetto"},{"letter":"D","text":"Prestazioni del personale di progetto"}],"answer":"C","id":106},{"source":"Simulazione 2024","orig_num":47,"question":"Con riferimento allo sviluppo del budget di progetto, individuare quale delle seguenti informazioni non è corretta_____","options":[{"letter":"A","text":"la stima dei costi e l'elaborazione del budget sono strettamente collegati"},{"letter":"B","text":"fa parte dei processi di esecuzione"},{"letter":"C","text":"per coprire costi imprevisti possono essere create e utilizzate riserve o quote di contingenza"},{"letter":"D","text":"l'assegnazione del budget agli elementi di lavoro programmati dovrebbe fornire un budget basato sul programma temporale rispetto al quale possono essere confrontate le prestazioni effettive"}],"answer":"B","id":107},{"source":"Simulazione 2024","orig_num":48,"question":"Un valore di CV negativo ad uno stato di avanzamento lavori indica che:","options":[{"letter":"A","text":"Il progetto sta performando bene rispetto ai costi"},{"letter":"B","text":"Il progetto finirà in ritardo"},{"letter":"C","text":"Il progetto sta impegnando più di quanto dovrebbe"},{"letter":"D","text":"Il costo alla fine del progetto sarà sicuramente minore del pianificato"}],"answer":"C","id":108},{"source":"Simulazione 2024","orig_num":49,"question":"Quale è la formula per calcolare l'EAC, nel caso in cui la stima del costo finale si dovesse calcolare tenendo conto di quanto effettivamente speso (AC), del valore in termini di budget del lavoro realizzato (EV), della performance economica (CPI) e della performance di schedulazione (SPI)?","options":[{"letter":"A","text":"EAC = EV - PV"},{"letter":"B","text":"EAC = AC + ETC = AC + ((BAC - EV) / CPI)"},{"letter":"C","text":"EAC = AC + ETC = AC + ((BAC - EV) / (CPI x SPI))"},{"letter":"D","text":"EAC = AC + ETC = AC + (BAC - EV)"}],"answer":"C","id":109},{"source":"Simulazione 2024","orig_num":51,"question":"Con chi comunica il Project Manager nel progetto?","options":[{"letter":"A","text":"Con i componenti del team di progetto, lo sponsor e tutti gli altri stakeholder (chiave, istituzionali, operativi, marginali)"},{"letter":"B","text":"Con gli altri Project Manager dell'organizzazione, secondo una linea gerarchica orizzontale"},{"letter":"C","text":"Solo con lo sponsor o l'alta direzione, delegando il resto delle comunicazioni ai membri del team di project management"},{"letter":"D","text":"Interviene nei momenti di criticità con chiunque. Durante la normale gestione dedica il suo tempo alla formulazione e aggiornamento del piano di progetto"}],"answer":"A","id":110},{"source":"Simulazione 2024","orig_num":52,"question":"Le abilità a cui il Project Manager fa ricorso per l'esercizio della leadership sono:","options":[{"letter":"A","text":"Abilità di autocoscienza, empatia, gestione delle emozioni e gestione dello stress"},{"letter":"B","text":"Abilità personali, relazionali, di pensiero strategico e creativo, di pensiero sistemico"},{"letter":"C","text":"Abilità di laboriosità, affidabilità, intraprendenza, adattabilità, responsabilità"},{"letter":"D","text":"Abilità di spirito di gruppo, adattamento a contesti multiculturali, senso dell'organizzazione, esperienza nella gestione dei gruppi"}],"answer":"B","id":111},{"source":"Simulazione 2024","orig_num":53,"question":"Che conseguenza ha un comportamento descritto dalla teoria X di McGregor?","options":[{"letter":"A","text":"Un assetto organizzativo prescrittivo, costrittivo e caratterizzato da totale accentramento causa esattamente i comportamenti previsti da tale ipotesi: le persone sviluppano atteggiamenti restrittivi ed opportunistici"},{"letter":"B","text":"Le persone, soggette ad un assetto costrittivo e private di ogni delega, dimostrano incapacità di assumere responsabilità complesse"},{"letter":"C","text":"La situazione “X” si caratterizza per la sfiducia reciproca che blocca ogni stimolo di crescita personale e professionale, inducendo a ritenere molto difficoltoso il passaggio da una condizione “X” a una condizione “Y\"\""},{"letter":"D","text":"Tutte le risposte sono corrette"}],"answer":"D","id":112},{"source":"Simulazione 2024","orig_num":54,"question":"Differenze tra Team Building e Team Working:","options":[{"letter":"A","text":"Il primo è significativo di un percorso evolutivo attraverso il quale un insieme di persone tende a trasformarsi in un team di progetto, cioè un gruppo coeso, integrato e sinergico, mentre il secondo individua il lavoro di gruppo con condivisione di obiettivi e di motivazioni"},{"letter":"B","text":"Lo scopo del team working è quello di far sentire il gruppo come una vera squadra"},{"letter":"C","text":"Il primo individua il lavoro di gruppo con condivisione di obiettivi e di motivazioni, mentre il secondo è significativo di un percorso evolutivo attraverso il quale un insieme di persone tende a trasformarsi in un team di progetto, cioè un gruppo coeso, integrato e sinergico"},{"letter":"D","text":"Nel team building gli individui sono già parte di un gruppo precostituito e lo scopo è quello di lavorare in modo più sinergico tra loro per raggiungere un obiettivo comune"}],"answer":"A","id":113},{"source":"Simulazione 2024","orig_num":55,"question":"L’abilità di un negoziatore si rivela nella sua capacità di:","options":[{"letter":"A","text":"Dimostrare una sufficiente flessibilità, in modo da poter utilizzare efficacemente le alternative che possono presentarsi durante la sessione negoziale"},{"letter":"B","text":"Tutte le risposte sono corrette"},{"letter":"C","text":"Comprendere i livelli e le tolleranze di accettabilità di una soluzione (compromesso), sia per la propria che per l’altrui parte, al fine di concludere in modo positivo il negoziato"},{"letter":"D","text":"Disporre di una prontezza e di una duttilità intellettiva, tali da consentirgli di adattarsi alle mutevoli esigenze presentate dalla specifica situazione negoziale"}],"answer":"B","id":114},{"source":"Simulazione 2024","orig_num":56,"question":"Cosa può diventare un handicap nella gestione del conflitto?","options":[{"letter":"A","text":"Il conflitto in sé stesso"},{"letter":"B","text":"La maniera sbagliata di gestirlo o non gestirlo (magari rimandandolo)"},{"letter":"C","text":"Le persone che hanno dato origine e vivono il conflitto"},{"letter":"D","text":"Il non aver eliminato la causa del conflitto prima della partenza del progetto"}],"answer":"B","id":115},{"source":"Simulazione 2024","orig_num":57,"question":"In cosa consiste l'approccio della Rinuncia nella gestione dei conflitti nel team di progetto?","options":[{"letter":"A","text":"Nell'evitare la situazione ritirandosi, con l'intento di mitigare la situazione (temporanea) di sconfitta"},{"letter":"B","text":"Nell'attenuare i punti di divergenza"},{"letter":"C","text":"Nell'affrontare apertamente il conflitto"},{"letter":"D","text":"Nel far prevalere con forza il proprio punto di vista"}],"answer":"A","id":116},{"source":"Simulazione 2024","orig_num":59,"question":"L'etica può assumere diversi connotati. Indicare l'affermazione ERRATA:","options":[{"letter":"A","text":"L'etica può essere prescrittiva, se indica norme e criteri da seguire"},{"letter":"B","text":"L'etica può essere soggettiva, se considera il soggetto che agisce"},{"letter":"C","text":"L'etica può essere oggettiva, se considera valori comuni e istituzioni"},{"letter":"D","text":"L'etica può essere adattiva, se si adatta agli obiettivi del progetto"}],"answer":"D","id":117},{"source":"Simulazione 2024","orig_num":60,"question":"Per costruire una WBS ottimale NON è buona regola:","options":[{"letter":"A","text":"Analizzare il contratto e le clausole annesse"},{"letter":"B","text":"Scendere a livello delle singole attività"},{"letter":"C","text":"Scomporre fino al livello più dettagliato possibile"},{"letter":"D","text":"Scomporre in base ai rischi dei deliverable"}],"answer":"D","id":118},{"source":"Simulazione 1-30","orig_num":2,"question":"IPMA è:","options":[{"letter":"A","text":"Associazione internazionale di project management che pubblica ICB"},{"letter":"B","text":"Il manuale dell’istituto ICB"},{"letter":"C","text":"Un manuale di competenze tecniche, comportamentali e di contesto"},{"letter":"D","text":"Uno standard di riferimento"}],"answer":"A","id":119},{"source":"Simulazione 1-30","orig_num":3,"question":"Per gestire il rischio di un evento il cui danno è altissimo si può adottare la seguente opzione di pianificazione della risposta:","options":[{"letter":"A","text":"Mitigare"},{"letter":"B","text":"Accettare"},{"letter":"C","text":"Trasferire"},{"letter":"D","text":"Tutte le risposte elencate sono corrette"}],"answer":"D","id":120},{"source":"Simulazione 1-30","orig_num":5,"question":"Quale delle seguenti non è una caratteristica di progetto?","options":[{"letter":"A","text":"Obiettivo prefissato"},{"letter":"B","text":"Temporaneità"},{"letter":"C","text":"Unicità"},{"letter":"D","text":"Ripetibilità"}],"answer":"D","id":121},{"source":"Simulazione 1-30","orig_num":7,"question":"Quali sono le caratteristiche di una struttura organizzativa?","options":[{"letter":"A","text":"Controllo del personale, sviluppo di conoscenze, flessibilità, efficacia ed efficienza dei processi."},{"letter":"B","text":"Controllo del Personale, risparmio sui costi, comodità logistica."},{"letter":"C","text":"Interscambiabilità di ruoli, struttura matriciale, efficacia ed efficienza"},{"letter":"D","text":"Controllo del personale, sviluppo di conoscenze, flessibilità."}],"answer":"A","id":122},{"source":"Simulazione 1-30","orig_num":8,"question":"In un gruppo di progetto si ha uno stato di crisi allorché","options":[{"letter":"A","text":"Esiste una situazione di conflitto in cui non riescono ad essere utili e durature logiche di “win-win”"},{"letter":"B","text":"Esiste una situazione di conflitto senza apparenti vie di uscita o di paralisi di lunga durata, con rinuncia a ricercare soluzioni"},{"letter":"C","text":"Esiste una situazione di conflitto superabile solo attraverso logiche “win lose” (risoluzione tramite uno stile di pressione che fa prevalere il proprio punto di vista a scapito dell’avversario)"},{"letter":"D","text":"Esiste una condizione di conflitto percepito e manifesto, che può portare ad una situazione di stallo"}],"answer":"B","id":123},{"source":"Simulazione 1-30","orig_num":9,"question":"Un contratto Fixed Price prevede la realizzazione di un’opera al costo di 100.000€. Durante il lavoro, il fornitore incontra un imprevisto che gli fa aumentare i costi di 30.000€. Il costo finale dell’opera, per il cliente, sarà:","options":[{"letter":"A","text":"100.000€"},{"letter":"B","text":"Nessuna delle risposte elencate è valida."},{"letter":"C","text":"130.000€"},{"letter":"D","text":"115.000€"}],"answer":"A","id":124},{"source":"Simulazione 1-30","orig_num":12,"question":"La gestione del processi di cambiamento:","options":[{"letter":"A","text":"Rappresenta un approccio strutturato per l’implementazione efficiente dei cambiamenti"},{"letter":"B","text":"Riguarda le richieste da parte di un cliente di aggiungere al progetto un nuovo work package"},{"letter":"C","text":"E’ di competenza dello Sponsor di progetto e non del Project Manager"},{"letter":"D","text":"Riguarda la sola gestione delle modifiche richieste dal cliente rispetto al prodotto finale"}],"answer":"A","id":125},{"source":"Simulazione 1-30","orig_num":13,"question":"ISO 45001 è una norma di riferimento in tema di:","options":[{"letter":"A","text":"Sistemi di gestione della salute e della sicurezza umana"},{"letter":"B","text":"Sistemi di organizzazione e gestione dei gruppi di progetto"},{"letter":"C","text":"Piano della sicurezza"},{"letter":"D","text":"Piano gestione ambientale"}],"answer":"A","id":126},{"source":"Simulazione 1-30","orig_num":14,"question":"Fra i metodi più noti di valutazione di un progetto ci sono:","options":[{"letter":"A","text":"NPV (Net Present Value) e BCV (Base Cost Value)"},{"letter":"B","text":"IRR (Internal rate of return) e CPV (Cost Present Value)"},{"letter":"C","text":"ROI (Return on Investment) e PP (Payback Period)"},{"letter":"D","text":"PV (Present Value) e PDR (Present Discount Rate)"}],"answer":"C","id":127},{"source":"Simulazione 1-30","orig_num":15,"question":"Si definisce \"Cost Performance Index\":","options":[{"letter":"A","text":"Il rapporto fra AC/EV"},{"letter":"B","text":"Il rapporto fra EV/AC"},{"letter":"C","text":"Il rapporto fra PV/EV"},{"letter":"D","text":"Nessuno delle precedenti risposte è corretta"}],"answer":"B","id":128},{"source":"Simulazione 1-30","orig_num":16,"question":"Rispetto al ciclo di Deming (Plan, Do, Check, Act) il Controllo di progetto comprende:","options":[{"letter":"A","text":"Check + Act"},{"letter":"B","text":"Do"},{"letter":"C","text":"Act"},{"letter":"D","text":"Check"}],"answer":"A","id":129},{"source":"Simulazione 1-30","orig_num":17,"question":"Nel project management l’acronimo “CPI”:","options":[{"letter":"A","text":"E’ pari al rapporto, a una certa data, fra il lavoro effettivamente realizzato e quanto pianificato."},{"letter":"B","text":"Significa Cost Program Indicator"},{"letter":"C","text":"E’ un indice di valutazione della produttività economica del progetto"},{"letter":"D","text":"E’ sinonimo di “varianza di costo”."}],"answer":"C","id":130},{"source":"Simulazione 1-30","orig_num":19,"question":"Una delle seguenti affermazioni NON descrive correttamente il ruolo di un Project Management Office (PMO)?","options":[{"letter":"A","text":"Il PMO ha responsabilità di formazione, standard e procedura sul Project Management"},{"letter":"B","text":"Il PMO è un’unità organizzativa tipicamente presente in un’organizzazione di tipo funzionale"},{"letter":"C","text":"Il PMO ha il compito di supportare i manager funzionali nella gestione delle risorse condivise in più progetti"},{"letter":"D","text":"Il PMO è un’unità organizzativa che centralizza e coordina la gestione di progetti aziendali"}],"answer":"B","id":131},{"source":"Simulazione 1-30","orig_num":20,"question":"Le Strategie di progetto:","options":[{"letter":"A","text":"Stabiliscono le linee di azione da seguire per raggiungere gli obiettivi"},{"letter":"B","text":"Definiscono i criteri di accettazione di tutti gli stakeholder"},{"letter":"C","text":"Sono individuate dalla lista degli Obiettivi di progetto"},{"letter":"D","text":"Minimizzano i rischi negativi"}],"answer":"A","id":132},{"source":"Simulazione 1-30","orig_num":21,"question":"Durante l’ultimo SAL il capo progetto ha dichiarato che il CPI è maggiore di 1. Questo significa che:","options":[{"letter":"A","text":"Si sta spendendo meno e quindi il costo finale del progetto potrebbe essere inferiore al previsto"},{"letter":"B","text":"Si sta in ritardo sui tempi"},{"letter":"C","text":"Nessuna delle risposte elencate è vera"},{"letter":"D","text":"Si sta procedendo più speditamente e quindi il progetto potrebbe finire in anticipo"}],"answer":"A","id":133},{"source":"Simulazione 1-30","orig_num":22,"question":"Gli Obiettivi di progetto:","options":[{"letter":"A","text":"Corrispondono
